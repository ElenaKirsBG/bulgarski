<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Български език</title>
<meta name="description" content="Курс болгарского языка с ударениями, грамматикой, словарём и карточками">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Български">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2421; --muted:#68716c; --line:#e3e0d8;
  --accent:#1f4d3a; --accent-soft:#e3eee8; --red:#a8323a; --red-soft:#f6e5e6;
  --st:#a8323a; --gold:#9a7b2f; --ok:#2f7a4f; --bad:#b0413e;
  --radius:14px; --fs:17px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
:root[data-theme="dark"]{
  --bg:#121614; --card:#1b201d; --ink:#e7ece9; --muted:#9aa49f; --line:#2b322e;
  --accent:#7cc4a0; --accent-soft:#20342a; --red:#e07a80; --red-soft:#3a2224;
  --st:#f08a90; --gold:#d6b46a; --ok:#6fcf97; --bad:#ef7d7a; --shadow:none;
}
:root[data-theme="sepia"]{
  --bg:#f1e8d6; --card:#fbf5e8; --ink:#3b2f22; --muted:#7a6a55; --line:#e2d5bc;
  --accent:#6b4b2a; --accent-soft:#eadcc2; --red:#9b3b2a; --red-soft:#f0d9cc; --st:#b0412b;
}
:root[data-theme="blue"]{
  --bg:#eef2f7; --card:#ffffff; --ink:#1b2430; --muted:#5f6b7a; --line:#dde4ee;
  --accent:#27466e; --accent-soft:#e2eaf5; --red:#a5343c; --red-soft:#f5e3e4; --st:#b2323b;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#121614; --card:#1b201d; --ink:#e7ece9; --muted:#9aa49f; --line:#2b322e;
    --accent:#7cc4a0; --accent-soft:#20342a; --red:#e07a80; --red-soft:#3a2224;
    --st:#f08a90; --gold:#d6b46a; --ok:#6fcf97; --bad:#ef7d7a; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.12em;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.back{border:0;background:none;color:var(--accent);font-size:1em;padding:4px 6px 4px 0;cursor:pointer;display:none}
.back.show{display:block}
.flag{width:22px;height:15px;border-radius:3px;overflow:hidden;display:inline-flex;flex-direction:column;flex:none;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1}.flag i:nth-child(1){background:#fff}.flag i:nth-child(2){background:#00966e}.flag i:nth-child(3){background:#d62612}
main{max-width:760px;margin:0 auto;padding:14px 16px 24px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 16px;margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.86em}
.part-h{margin:22px 2px 8px;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.lesson-item{display:flex;align-items:center;gap:12px;cursor:pointer}
.lesson-item .num{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:.9em}
.lesson-item.done .num{background:var(--accent);color:var(--card)}
.lesson-item .t{font-weight:600;line-height:1.3}
.lesson-item .s{font-size:.82em;color:var(--muted);line-height:1.35;margin-top:2px}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.lesson h2{font-size:1.18em;margin:22px 0 8px;color:var(--accent);font-weight:680}
.lesson h3{font-size:1.02em;margin:16px 0 6px}
.lesson p{margin:8px 0}
.lesson ul{margin:6px 0;padding-left:1.2em}.lesson li{margin:3px 0}
.lesson .src{font-size:.8em;color:var(--muted);margin-top:-4px}
.lesson .goal{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.94em;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:650}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .bg{font-weight:560}
.ex .ru{color:var(--muted);font-size:.92em}
.say{border:0;background:var(--accent-soft);color:var(--accent);width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px}
.say svg{width:16px;height:16px}
.exs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--accent);margin-right:4px}
.note{border-left:4px solid var(--red);background:var(--red-soft);border-radius:8px;padding:9px 12px;margin:10px 0}
.tip{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card));border-radius:8px;padding:9px 12px;margin:10px 0}
.vocab{display:grid;grid-template-columns:1fr;gap:0;margin:8px 0}
.vocab .w{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.vocab .w b{font-weight:600}.vocab .w span{color:var(--muted);text-align:right}
.st{color:var(--st)}
.hide-stress .acc{display:none}
.quiz .q{margin:14px 0 6px;font-weight:600}
.quiz .opts{display:flex;flex-direction:column;gap:6px}
.quiz .opts button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:.95em;cursor:pointer}
.quiz .opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.quiz .opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.quiz .ex-ans{font-size:.88em;color:var(--muted);margin:6px 2px 0;display:none}
.quiz .ex-ans.show{display:block}
.btn{border:0;background:var(--accent);color:var(--card);padding:11px 16px;border-radius:12px;font-size:.96em;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.red{background:var(--red-soft);color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{width:100%;font-size:1em;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--accent-soft);border-radius:10px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:7px 6px;border-radius:8px;color:var(--accent);font-size:.86em;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:650}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 10px;border-radius:20px;font-size:.82em;cursor:pointer}
.chip.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
.entry{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.entry .h{font-weight:600}.entry .p{font-size:.78em;color:var(--muted);margin-left:6px;font-weight:400}
.entry .r{color:var(--muted);text-align:right;font-size:.94em}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.letters button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9em}
.letters button.on{background:var(--accent);color:var(--card)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}.sheet-bg.open{display:block}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.big{font-size:1.6em;font-weight:680;line-height:1.2}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:.78em;margin:2px 4px 2px 0}
.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .front{font-size:1.7em;font-weight:680}.fc .back{font-size:1.1em;color:var(--muted);margin-top:14px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
select,input[type=range]{font-size:.95em}
select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span:before{transform:translateX(20px)}
.toc a{display:block;color:var(--accent);text-decoration:none;padding:3px 0;font-size:.92em}
.pill{font-size:.75em;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.footer{font-size:.75em;color:var(--muted);text-align:center;margin:26px 0 6px}
.wordlink{border-bottom:1px dotted color-mix(in srgb,var(--accent) 50%,transparent);cursor:pointer}
.lvl{font-size:.72em;font-weight:700;color:var(--gold);letter-spacing:.05em}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.88em;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.wok{color:var(--ok);font-weight:600}.wbad{color:var(--bad);font-weight:600;text-decoration:underline wavy color-mix(in srgb,var(--bad) 60%,transparent)}
.fb-ok{color:var(--ok);font-weight:650;margin:6px 0 2px}.fb-mid{color:var(--gold);font-weight:650;margin:6px 0 2px}.fb-bad{color:var(--bad);font-weight:650;margin:6px 0 2px}
.pq{padding:10px 0;border-bottom:1px dashed var(--line)}.pq:last-child{border-bottom:0}
.prow{flex-wrap:wrap}.pin,.tin{flex:1 1 220px;min-width:0;font:inherit;font-size:1em;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.tin{width:100%;margin:8px 0;resize:vertical}.pin:focus,.tin:focus{border-color:var(--accent)}
.in-ok{border-color:var(--ok)!important}.in-bad{border-color:var(--bad)!important}
.pfb,.tfb{font-size:.95em}.prac{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px 12px;margin:10px 0}
.say.sm{width:26px;height:26px;display:inline-flex;vertical-align:middle}.say.mic{background:var(--red-soft);color:var(--red)}
.tq .row{gap:8px}
/* библиотека и читалка */
.busy{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
.busy .card{display:flex;gap:12px;align-items:center;max-width:340px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.rbar{display:flex;gap:8px;align-items:center;margin:0 -16px 10px;padding:6px 16px;flex-wrap:wrap;position:sticky;top:var(--hh,52px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.rtitle{margin:6px 0 18px;text-align:center}
.reader{line-height:1.62;color:var(--ink)}
.reader .bp{margin:0 0 .75em;text-indent:1.3em}
.reader .bh{font-size:1.18em;margin:1.2em 0 .7em;text-align:center;line-height:1.3}
.reader .w{cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}
.reader .w.hl{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.reader .w.my{border-bottom:2px solid var(--gold)}
.reader .gl{color:var(--muted);font-size:.86em;font-family:-apple-system,system-ui,sans-serif}
.reader.frank .bp.g{text-indent:0;text-align:left;background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:.4em}
.reader.fm-g .bp:not(.g){display:none}.reader.fm-p .bp.g{display:none}
.rnav{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.ctx{margin-top:12px;padding:10px 12px;background:var(--accent-soft);border-radius:12px}
.ctx a{color:var(--accent)}
.fl{display:block;font-size:.85em;color:var(--muted);margin:8px 0}.fl .search,.fl .tin{margin-top:4px;color:var(--ink);font-size:1.1em}
.ctxl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;font-style:italic}
.pgwrap{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:10px;border:1px solid var(--line);margin-top:10px}
.pgwrap img{display:block;max-width:none;height:auto}
:root[data-theme="dark"] .pgwrap img{filter:invert(.9)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] .pgwrap img{filter:invert(.9)}}
.vpick{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 4px;font-size:1.3em}
.vpick .vb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-width:34px;padding:4px 6px;font-size:1em;cursor:pointer}
.vpick .vb.on{background:var(--red-soft);color:var(--st);border-color:var(--st);font-weight:700}
.vpick .vc{padding:5px 2px;color:var(--muted)}
.addm{position:relative;padding:8px 36px 8px 10px;border-left:3px solid var(--gold);background:var(--accent-soft);border-radius:8px;margin:6px 0}
.addm .chip{position:absolute;right:6px;top:6px;padding:2px 7px}
.srcb{font-size:.7em;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 4px;margin-left:6px}
.mf{color:var(--muted);line-height:1.45}
.vtabs{margin:12px 0 4px}
.mk{border-left:3px solid var(--gold);padding-left:8px;margin-left:-11px}
.mbadge{float:right;font-size:.8em;cursor:pointer;margin-left:6px;padding:0 4px;border-radius:6px;background:var(--accent-soft)}
.w.hlq{background:rgba(214,180,106,.38);border-radius:2px}
.flash{animation:fl 1.8s ease}@keyframes fl{0%,40%{background:rgba(214,180,106,.5)}100%{background:transparent}}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:8px;z-index:40;padding:8px}
.selbar.show{display:flex}.selbar .btn{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mquote{font-style:italic;padding:8px 12px;border-left:3px solid var(--gold);background:var(--accent-soft);border-radius:8px;margin:8px 0}
.mrow.c-green{border-left:4px solid #3a9a5b;padding-left:8px}.mrow.c-blue{border-left:4px solid #3b6fb6;padding-left:8px}.mrow.c-red{border-left:4px solid #c0474b;padding-left:8px}.mrow.c-gold{border-left:4px solid var(--gold);padding-left:8px}
.cont{border:1px solid var(--gold);cursor:pointer}
mark{background:rgba(214,180,106,.5);color:inherit;border-radius:2px}
details.hlp{padding:0}details.hlp summary{padding:14px 16px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.hlp summary::after{content:"›";color:var(--accent);transform:rotate(90deg);transition:transform .2s}details.hlp[open] summary::after{transform:rotate(-90deg)}
details.hlp summary::-webkit-details-marker{display:none}details.hlp .hb{padding:0 16px 14px;line-height:1.55}details.hlp .hb li{margin:4px 0}
code{background:var(--accent-soft);padding:1px 5px;border-radius:5px;font-size:.95em}.help-card{cursor:pointer;border:1px solid var(--accent)}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="backBtn" aria-label="Назад">‹ Назад</button>
  <span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>
  <h1 id="title">Български език</h1>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="course" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Курс</button>
  <button data-tab="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Словарь</button>
  <button data-tab="texts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 10h16M4 14h10M4 18h7"/><path d="m17 15 4 4m0-4-4 4"/></svg>Чтение</button>

## Кириллица — общая с русской
Болгарский алфавит — это кириллица. Её создали в Болгарии в конце IX — начале X века ученики святых Кирилла и Мефодия (Преславская книжная школа), а название дали в честь Кирилла. Поэтому почти все буквы вам уже знакомы.

В болгарском алфавите **30 букв**, в русском — 33. В болгарском **нет букв Ы, Э, Ё**. Буква **Ъ** — не «твёрдый знак», а полноценный гласный звук, который часто бывает под ударением.

## Буквы-«ловушки» для русскоговорящих
### Щ = [шт]
Болгарская Щ читается как сочетание **[шт]**, а не как русское долгое [щ].
> къ́ща = дом (читается [къ́шта])
> ща́стие = счастье
> ще = будет (частица будущего времени)
> о́ще = ещё
> щастли́в = счастливый

### Ъ — гласный звук
**Ъ** обозначает гласный, похожий на русский безударный звук во втором слоге слов «ко́мната», «па́мять» или на гласный в английском *bird* (только короче). В болгарском этот звук бывает и **под ударением**, и в начале слова.
> мъ́ж = мужчина, муж
> ъ́гъл = угол
> пъ́т = путь, дорога; раз
> бъ́лгарин = болгарин
> същ = тот же самый
> сън = сон

### Ь — только перед О
Мягкий знак (ер ма́лък) пишется **только перед О** после согласного и обозначает мягкость: сочетание **ьо** = русское «ё» после согласного. В начале слова и после гласного вместо «ё» пишут **йо**.
> шофьо́р = водитель, шофёр
> актьо́р = актёр
> бельо́ = бельё
> асансьо́р = лифт
> майо́р = майор
> йод = йод

### Ю и Я
После согласного **Ю** и **Я** смягчают его, как в русском; в начале слова и после гласного читаются [йу], [йа].
> ю́ли = июль
> я́бълка = яблоко
> бял = белый
> мо́ят = мой (с артиклем)

## Чего нет в болгарском
- **Ы** — вместо неё пишется И: {ри́ба} — рыба, {си́н} — сын.
- **Э** — вместо неё пишется Е: {е́хо} — эхо, {ета́ж} — этаж.
- **Ё** — вместо неё пишется ЬО или ЙО: {шофьо́р}, {йод}.
- **Твёрдый знак как разделитель** не нужен — Ъ всегда гласная.

?? Сравните: русское «съел» — болгарское {изя́дох}; русское «подъезд» — болгарское {вхо́д}. Разделительного знака в болгарском нет.

## Сочетания ДЖ и ДЗ
Это слитные звуки (аффрикаты), читаются одним звуком, как английское *j* в *jam*.
> джо́б = карман
> джи́нси = джинсы (чаще говорят {дъ́нки})
> дзъ́н = дзинь (звон)

## Специальная буква-знак ѝ
В болгарском есть отдельная форма **ѝ** (и с тупым ударением, «гравис»). Это местоимение «ей / её» (кратко). Знак пишется, чтобы отличить её от союза **и**.
> Да́вам ѝ кни́гата. = Я даю ей книгу.
> Ма́ма и та́тко. = Мама и папа.

## Первые слова для чтения
W: ма́ма — мама
W: та́тко — папа
W: ба́ба — бабушка
W: дя́до — дедушка
W: къ́ща — дом (здание)
W: море́ — море
W: планина́ — гора (горный массив)
W: слъ́нце — солнце
W: хля́б — хлеб
W: вода́ — вода
W: я́бълка — яблоко
W: шофьо́р — водитель
W: ща́стие — счастье
W: дру́г — другой

!! «Солнце» по-болгарски пишется через ъ: **{слъ́нце}**. Русскоговорящие часто ошибаются и пишут «слонце» — запомните правильный вариант.

## Упражнение на чтение
Прочитайте вслух, затем нажмите кнопку озвучки и сравните:
> Ба́ба и дя́до и́мат къ́ща на море́то. = У бабушки и дедушки есть дом на море.
> Шофьо́рът пи́е ча́й. = Водитель пьёт чай.
> Това́ е мо́ят пъ́т. = Это мой путь.
> О́ще ча́ша вода́, мо́ля. = Ещё стакан воды, пожалуйста.

@src Иванова, ур. 1; Пашов и др., ур. 1–6 (фонетика); Гинина и др., ур. 1–5; Маслов «Грамматика», ч. I «Фонетика»; Голяновская–Платонова, вводный урок
@goal Произносить болгарские слова без «русского акцента»: не акать, не смягчать согласные перед Е, правильно произносить Ъ, Ч, Ж, Ш, Л.

## Шесть гласных
В болгарском шесть гласных звуков: **а, е, и, о, у, ъ**. Буквы **ю, я** обозначают сочетание [й] + гласный или мягкость предыдущего согласного.

| Ряд | Звуки | Пример |
|---|---|---|
| Передний | е, и | {ле́ко}, {ми́р} |
| Средний | а, ъ | {ма́са}, {мъгла́} |
| Задний | о, у | {до́м}, {ку́че} |

## Главное правило: НЕ «акайте»
В русском безударное О читается как [а] («мАлоко́»). В болгарском **О всегда звучит как О**, а Е — как Е, а не [и].
> вода́ = вода — читаем [во-да́], а не [ва-да́]
> добре́ = хорошо — [до-бре́], а не [да-бри́]
> полови́на = половина — [по-ло-ви́-на]
> Со́фия = София — [со́-фи-я]
> телефо́н = телефон — [те-ле-фо́н], а не [ти-ли-фо́н]

### Лёгкая редукция в болгарском
В естественной речи безударные гласные всё же немного ослабевают, но по-своему:
- безударное **а** звучит близко к **ъ**: {ма́ма} ≈ [ма́мъ], {вода́} ≈ [въда́] — слегка;
- безударное **о** в быстрой речи может приближаться к **у**: {голя́мо} ≈ [голя́му];
- безударные **е** и **и** НЕ смешиваются.
!! Для начала говорите все гласные чётко — вас поймут лучше, чем при «русской» редукции. Тонкая редукция придёт сама, когда будете слушать болгарскую речь.

## Звук Ъ
Ъ — краткий гласный среднего ряда. Чтобы его произнести, скажите русское «ы», но расслабьте губы и опустите язык чуть ниже. Похожий звук — безударный гласный в русских «пла́кать», «ка́ша» (во втором слоге).
> ъ́гъл = угол
> мъ́ж = мужчина
> вътре́ = внутри
> въ́здух = воздух
> съ́бота = суббота
> пъ́рви = первый

## Согласные
### Ж и Ш — мягче, Ч — твёрже
Болгарские **ж, ш** звучат чуть мягче русских, а **ч** — твёрже.
> жена́ = жена, женщина
> шал = шарф
> ча́нта = сумка
> чук = молоток
> чи́сто = чисто

### Согласные перед Е и И почти не смягчаются
В русском «нет», «тир» согласные мягкие. В болгарском перед **е, и** они смягчаются гораздо слабее (а перед **е** — почти как твёрдые).
> не = не (близко к [нэ])
> те = они
> ти = ты
> дете́ = ребёнок

### Буква Л
Перед **е, и, ю, я** Л мягкая, как в русском «лес». В остальных позициях — твёрдая, но не такая «тёмная», как русская Л в слове «лодка»; в разговорной речи столичной молодёжи иногда звучит почти как [у̯] — подражать этому не нужно.
> ле́ко = легко
> ля́то = лето
> ло́шо = плохо
> ла́мпа = лампа

### Ц перед Е, И, Я — мягкая
В отличие от русского, болгарская Ц перед **и, е, я** смягчается:
> цве́те = цветок
> ци́рк = цирк
> ця́л = целый

## Оглушение и уподобление
Как в русском, звонкие на конце слова и перед глухими оглушаются, хотя пишутся по-прежнему:
> гра́д = город [гра́т]
> хля́б = хлеб [хля́п]
> нож = нож [нош]
> вкъ́щи = дома [фкъ́шти]
> сва́тба = свадьба [сва́дба]

## Перегласовка Я / Е («променливо я», ятов преглас)
Очень важное явление: под ударением в некоторых словах пишется **я**, а когда ударение уходит или следующий слог содержит мягкий согласный или гласный **е / и** — пишется **е**.
| я (под ударением) | е |
|---|---|
| {бял} — белый | {бе́ли} — белые |
| {хля́б} — хлеб | {хле́бен} — хлебный |
| {мля́ко} — молоко | {млека́р} — молочник |
| {ля́то} — лето | {ле́тен} — летний |
| {голя́м} — большой | {голе́ми} — большие |
| {ця́л} — целый | {це́ли} — целые |
| {мя́сто} — место | {места́} — места |
| {бя́гам} — бегу | {бе́г} — бег |

!! Правило: «я» стоит только под ударением **и** только если в следующем слоге нет е, и, мягкого согласного, ж, ш, ч, щ, й. Если хоть одно условие нарушено — пишем **е**: {бял} → {бе́ли}, {голя́м} → {голе́ми}.

## Произносим фразы
> Добро́ у́тро! = Доброе утро!
> Ле́ка но́щ! = Спокойной ночи!
> Къде́ е тоале́тната? = Где туалет?
> Не разби́рам. = Не понимаю.
> Гово́рите ли ру́ски? = Вы говорите по-русски?

## Как устроено ударение
Болгарское ударение, как и русское, **свободное** (может стоять на любом слоге) и **подвижное** (может переходить при изменении слова). На письме оно не обозначается — поэтому в этом приложении во всех многосложных словах поставлен знак ударения (а в настройках можно включить цветовую подсветку ударной гласной).

> ма́ма = мама (первый слог)
> вода́ = вода (второй слог)
> ра́бота = работа (первый слог!)
> телефо́н = телефон (третий слог)

!! Ударение в болгарском **сильное**, но длительность гласных не меняется так сильно, как в русском. Безударные гласные не «проглатываются».

## Ударение различает слова
| Ударение 1 | Перевод | Ударение 2 | Перевод |
|---|---|---|---|
| {въ́лна} | шерсть | {вълна́} | волна |
| {па́ра} | пар | {пара́} | монетка; мн. {пари́} — деньги |
| {ко́ла} | кока-кола | {кола́} | машина, автомобиль |
| {чете́} | (он) читает | {че́те} | (он) прочитал вчера (аорист) |
| {до́йде} | (чтобы он) пришёл, придёт | {дойде́} | (он) пришёл (аорист) |

## Подвижное ударение
Ударение может переходить внутри одного слова при изменении формы:
| Форма | Пример |
|---|---|
| ед. ч. | {гра́д} — город |
| с артиклем | {градъ́т}, {града́} |
| мн. ч. | {градове́} — города |
| ед. ч. | {сестра́} |
| мн. ч. | {сестри́} |
| ед. ч. | {ръка́} |
| мн. ч. | {ръце́} |
| м. р. | {до́бър} |
| ж. р. | {добра́} |

## Ударение после «не»
Если после отрицания **не** идёт безударное (краткое) слово — форма глагола {съм}, краткое местоимение, частица {се} — ударение **переходит на него**:
> Не съ́м студе́нт. = Я не студент.
> Тя не е́ от Бълга́рия. = Она не из Болгарии.
> Не го́ зна́я. = Я его не знаю.
> Не се́ безпоко́й! = Не беспокойся!

## Правописание: ударение на письме
В обычных текстах болгары ставят знак ударения только для различения слов. Обязательна только **ѝ** (местоимение «ей»). В учебниках и в этом приложении ударения ставятся везде, кроме односложных слов.

## Жесты: осторожно!
!! В Болгарии традиционно **кивок головой вверх-вниз означает «нет»**, а **покачивание из стороны в сторону — «да»**. Молодые болгары, общаясь с иностранцами, часто используют «европейские» жесты — поэтому всегда уточняйте словами: {да} или {не}.

## Личные местоимения
| Лицо | Ед. число | Мн. число |
|---|---|---|
| 1 | {аз} — я | {ни́е} — мы |
| 2 | {ти} — ты | {ви́е} — вы |
| 3 | {той} — он, {тя} — она, {то} — оно | {те} — они |

?? {Ви́е} с большой буквы ({Ви́е}) пишут в письмах из уважения к одному человеку, как русское «Вы».

!! Болгарское {те} — это «они», а не «те». Русское «те» по-болгарски — {они́я}, {те́зи} (см. урок 9).

## Глагол «съм» (быть) — настоящее время
| | Ед. ч. | Мн. ч. |
|---|---|---|
| 1 | {аз съм} — я есть | {ни́е сме} |
| 2 | {ти си} | {ви́е сте} |
| 3 | {той / тя / то е} | {те са} |

В отличие от русского, связку **нельзя опускать**: «Я студент» = {Аз съм студе́нт} (букв. «Я есть студент»).
> Аз съм студе́нтка. = Я студентка.
> Ти си ле́кар. = Ты врач.
> То́й е инжене́р. = Он инженер.
> Тя́ е от Со́фия. = Она из Софии.
> Ни́е сме прия́тели. = Мы друзья.
> Ви́е сте русна́ци. = Вы русские.
> Те са у дома́. = Они дома.

## Краткие формы не стоят в начале предложения
Формы {съм, си, е, сме, сте, са} — **безударные** (клитики). Они не могут начинать предложение. Если местоимение опущено, связка уходит на второе место:
| С местоимением | Без местоимения |
|---|---|
| {Аз съм студе́нт.} | {Студе́нт съм.} |
| {Ти си у́мен.} | {У́мен си.} |
| {Ни́е сме от Руси́я.} | {От Руси́я сме.} |

!! Неправильно: «Съм студент». Правильно: {Студе́нт съм} или {Аз съм студе́нт}. Местоимения в болгарском часто опускаются, потому что форма глагола и так показывает лицо.

## Отрицание: не
Отрицание {не} ставится **перед** формой {съм}, и форма получает ударение:
> Аз не съ́м ле́кар. = Я не врач.
> Не съ́м ле́кар. = Не врач (я).
> То́й не е́ тук. = Его здесь нет (он не здесь).
> Ни́е не сме́ тури́сти. = Мы не туристы.
> Те не са́ бъ́лгари. = Они не болгары.

## Вопрос: частица ли
В болгарском общий вопрос («да/нет») образуется частицей **ли**. Она ставится **сразу после слова, о котором спрашивают**, и сама безударная.
| Вопрос | Смысл |
|---|---|
| {Студе́нт ли си?} | Ты студент? (а не кто-то другой по профессии) |
| {Ти ли си студе́нтът?} | Это ты студент? (ты, а не другой человек) |
| {От Руси́я ли сте?} | Вы из России? |
| {Тук ли е Ива́н?} | Иван здесь? |

Краткие формы {съм, си, е…} не могут начинать вопрос, поэтому «Ты студент?» — это {Студе́нт ли си?} или {Ти студе́нт ли си?}, но никогда не «Си ли студент?».

### Отрицательный вопрос
> Не си́ ли студе́нт? = Разве ты не студент?
> Не е́ ли тук? = Разве его нет здесь?

### Ответы
> Да, студе́нт съм. = Да, я студент.
> Не, не съ́м студе́нт. Ле́кар съм. = Нет, я не студент. Я врач.

## Частицы «нали» и «нали така»
{Нали́} = «не так ли? правда?»: {Ти си бъ́лгарка, нали́?} — Ты болгарка, правда?

Q: Как правильно без местоимения сказать «Я врач»? | Съм ле́кар. | *Ле́кар съм. | Ле́кар е. | Аз ле́кар. :: Клитика {съм} не может стоять в начале.

@goal Безошибочно определять род болгарского существительного по окончанию: от этого зависят прилагательные, местоимения и артикль.

## В болгарском нет падежей!
Хорошая новость: в современном болгарском **нет склонения по падежам** (кроме следов в местоимениях и звательной формы). Существительное меняется только по **числу** и получает **артикль** (член). Поэтому очень важно знать его **род**.

## Основное правило
| Род | Окончание | Примеры |
|---|---|---|
| Мужской | **согласная** (в т. ч. -й) | {гра́д}, {сто́л}, {чай}, {учи́тел}, {музе́й} |
| Женский | **-а, -я** | {жена́}, {ма́са}, {ста́я}, {ку́хня} |
| Средний | **-о, -е** и заимствования на **-и, -у, -ю** | {се́ло}, {море́}, {такси́}, {бижу́}, {меню́} |

Род определяет, каким местоимением заменяется уже названный предмет. Как и в русском, {то́й}, {тя́}, {то́} относятся не только к людям, но и к любым предметам — по их грамматическому роду. Указание же «это …» по-болгарски всегда {това́ е …}, независимо от рода.
> Това́ е сто́л. То́й е но́в. = Это стул. Он новый.
> Това́ е ма́са. Тя́ е голя́ма. = Это стол. Он большой.
> Това́ е легло́. То́ е удо́бно. = Это кровать. Она удобная.
> Къде́ е ма́сата? — Тя́ е в ку́хнята. = Где стол? — Он на кухне.
!! Род часто не совпадает с русским: {ма́са} (стол) — ж. р., поэтому {тя́}; {легло́} (кровать) — ср. р., поэтому {то́}. Ошибка «Той е маса» — типичная для русскоговорящих.

## Исключения
### Женский род на согласную
Многие отвлечённые существительные, особенно на **-ост, -ест**, и некоторые другие:
W: но́щ — ночь
W: ра́дост — радость
W: мла́дост — молодость
W: ско́рост — скорость
W: любо́в — любовь
W: со́л — соль
W: е́сен — осень
W: про́лет — весна
W: но́вост — новость
W: кръ́в — кровь
W: по́мощ — помощь
W: ве́чер — вечер (ж. р.; см. ниже)

### Особый случай: {ве́чер}
По современной литературной норме {ве́чер} — существительное **женского рода**, как {но́щ}, {е́сен}, {про́лет}. В древнеболгарском языке это слово было мужского рода (вечеръ); в женский род оно перешло позднее, по аналогии со словом {но́щ}. Следы старого мужского рода сохранились только в нескольких застывших выражениях.
| Употребление | Род | Примеры |
|---|---|---|
| Обычная речь: определения, указательные слова, числительные | женский | {та́зи ве́чер} — этот вечер, {прия́тна ве́чер} — приятный вечер, {вся́ка ве́чер} — каждый вечер, {една́ ве́чер} — однажды вечером |
| Форма с артиклем | женский: только -та | {вечерта́} — этот вечер; вечером. Форм «вечерът», «вечерат» в литературном языке нет |
| Множественное число | женский | {ве́чери}, {ве́черите}; {две ве́чери} — два вечера |
| Застывшие выражения — след древнего мужского рода | мужской | {До́бър ве́чер!} — Добрый вечер!; {Бъ́дни ве́чер} — Сочельник (вечер перед Рождеством) |
| Время действия | без артикля | {в понеде́лник ве́чер} — в понедельник вечером; {ми́налата ве́чер} — в прошлый вечер; {сно́щи} — вчера вечером |
!! Запомните пару: здороваемся {До́бър ве́чер!} (застывший мужской род), прощаемся {Прия́тна ве́чер!} (современный женский род). Во всех остальных случаях согласуйте {ве́чер} как слово женского рода.
?? В разговорной речи и диалектах иногда встречаются следы мужского рода (например, «два вечера» вместо {две ве́чери}) — литературной нормой это не является. Некоторые учебники для начинающих упрощают правило и называют {ве́чер} словом мужского рода из-за приветствия {до́бър ве́чер}; академические грамматики относят его к женскому роду.

### Мужской род на гласную
Слова, обозначающие **лиц мужского пола**, даже если оканчиваются на -а, -о, -е, -и:
W: баща́ — отец
W: съдия́ — судья
W: слуга́ — слуга
W: дя́до — дедушка
W: чи́чо — дядя (брат отца)
W: ву́йчо — дядя (брат матери)
W: коле́га — коллега (м. и ж. р.)
W: аташе́ — атташе
!! {Коле́га} пишется с одной «л». Слово двуродовое: {но́вият коле́га} (о мужчине), {но́вата коле́га} или {коле́жка} (о женщине).

### Средний род: уменьшительные и дети
Слова на **-е** с уменьшительным значением — среднего рода, даже если обозначают мальчика или девочку:
W: дете́ — ребёнок
W: момче́ — мальчик
W: моми́че — девочка
W: ку́че — собака
W: ко́тенце — котёнок
W: пи́ле — цыплёнок; курица (мясо)
W: а́гне — ягнёнок

?? Отличия от русского: {ку́че} (собака) — ср. р.; {моми́че} (девочка) — ср. р.; {ве́чер} — ж. р. (но {до́бър ве́чер}); {бо́л} (боль) — ж. р.; {ме́д} — м. р.; {пъ́т} (путь) — м. р.

## Род — ключ ко всей грамматике
От рода зависят: прилагательные ({но́в сто́л}, {но́ва ма́са}, {но́во легло́}), артикль ({сто́лът}, {ма́сата}, {легло́то}), указательные местоимения ({то́зи}, {та́зи}, {това́}), числительные ({еди́н}, {една́}, {едно́}, {два}/{две}).

## Упражнение
Определите род:
> лимо́н = лимон — мужской род
> ста́я = комната — женский
> кафе́ = кофе, кафе — средний
> по́мощ = помощь — женский
> баща́ = отец — мужской
> момче́ = мальчик — средний
> ве́чер = вечер — женский (но застывшее {до́бър ве́чер})

## Проверьте себя
Q: Какого рода {но́щ}? | мужского | *женского | среднего :: {но́щ} — ж. р.
Q: Какого рода {баща́}? | женского | *мужского | среднего :: Лица мужского пола — м. р.
Q: Какого рода {моми́че}? | женского | мужского | *среднего :: Слова на -е — ср. р.
Q: Какого рода {такси́}? | мужского | женского | *среднего :: Заимствования на -и, -у, -ю — ср. р.
Q: Какого рода {ве́чер} в современном языке? | *женского | мужского | среднего :: По норме — ж. р.: {та́зи ве́чер}, {вечерта́}. Мужской род сохранился лишь в застывших выражениях {до́бър ве́чер}, {Бъ́дни ве́чер}.
Q: Какого рода {ра́дост}? | мужского | *женского | среднего :: Слова на -ост — ж. р.

## Беглая гласная

@src Иванова, ур. 3 («Глаголы III спряжения»), ур. 5 («Глаголы I и II спряжения»); Гинина и др., ур. 6–8; Пашов и др., ур. 8; Маслов, «Глагол. Спряжение»; Голяновская–Платонова, ур. 2–3; Данилова, ур. 3
@goal Спрягать любой болгарский глагол в настоящем времени и определять его спряжение по форме 2-го лица.

## В болгарском нет инфинитива
Важнейшая особенность: **неопределённой формы глагола нет**. В словарях глагол даётся в форме **1-го лица ед. ч. настоящего времени**: {чета́} — «читаю» = «читать», {пи́ша} — «пишу» = «писать», {и́мам} — «имею» = «иметь». Вместо инфинитива используется {да} + личная форма (урок 22): «Хочу читать» = {И́скам да чета́} (букв. «хочу, чтобы я читал»).

## Как определить спряжение
По **2-му лицу ед. ч.** (форма на {ти}): тематическая гласная перед -ш.
| Спряжение | 2-е лицо | Пример |
|---|---|---|
| I | **-еш** | {чета́ — чете́ш}, {пи́ша — пи́шеш} |
| II | **-иш** | {гово́ря — гово́риш}, {вървя́ — върви́ш} |
| III | **-аш / -яш** | {и́мам — и́маш}, {стре́лям — стре́ляш} |

!! Глаголы III спряжения легко узнать: в 1-м лице они оканчиваются на **-м** ({и́мам}, {гле́дам}, {чу́вам}). Глаголы I и II спряжения в 1-м лице оканчиваются на **-а / -я** — поэтому в словарях к ним добавляют 2-е лицо: {чета́, -е́ш}, {гово́ря, -иш}.

## I спряжение
| | {чета́} читать | {пи́ша} писать | {живе́я} жить | {пи́я} пить |
|---|---|---|---|---|
| аз | {чета́} | {пи́ша} | {живе́я} | {пи́я} |
| ти | {чете́ш} | {пи́шеш} | {живе́еш} | {пи́еш} |
| той, тя | {чете́} | {пи́ше} | {живе́е} | {пи́е} |
| ни́е | {чете́м} | {пи́шем} | {живе́ем} | {пи́ем} |
| ви́е | {чете́те} | {пи́шете} | {живе́ете} | {пи́ете} |
| те | {чета́т} | {пи́шат} | {живе́ят} | {пи́ят} |

Особые глаголы I спряжения с чередованием согласных:
| | {мо́га} мочь | {пека́} печь | {облека́} надеть |
|---|---|---|---|
| аз | {мо́га} | {пека́} | {облека́} |
| ти | {мо́жеш} | {пече́ш} | {облече́ш} |
| той | {мо́же} | {пече́} | {облече́} |
| ни́е | {мо́жем} | {пече́м} | {облече́м} |
| ви́е | {мо́жете} | {пече́те} | {облече́те} |
| те | {мо́гат} | {пека́т} | {облека́т} |

## II спряжение
| | {гово́ря} говорить | {вървя́} идти | {мо́ля} просить | {държа́} держать |
|---|---|---|---|---|
| аз | {гово́ря} | {вървя́} | {мо́ля} | {държа́} |
| ти | {гово́риш} | {върви́ш} | {мо́лиш} | {държи́ш} |
| той, тя | {гово́ри} | {върви́} | {мо́ли} | {държи́} |
| ни́е | {гово́рим} | {върви́м} | {мо́лим} | {държи́м} |
| ви́е | {гово́рите} | {върви́те} | {мо́лите} | {държи́те} |
| те | {гово́рят} | {вървя́т} | {мо́лят} | {държа́т} |

!! Типичная ошибка: «ни́е гово́риме». Правильно — {гово́рим} (I и II спряжения: -ем / -им). Окончание **-ме** только у III спряжения: {и́маме}.

## III спряжение
| | {и́мам} иметь | {гле́дам} смотреть | {стре́лям} стрелять |
|---|---|---|---|
| аз | {и́мам} | {гле́дам} | {стре́лям} |
| ти | {и́маш} | {гле́даш} | {стре́ляш} |
| той, тя | {и́ма} | {гле́да} | {стре́ля} |
| ни́е | {и́маме} | {гле́даме} | {стре́ляме} |
| ви́е | {и́мате} | {гле́дате} | {стре́ляте} |
| те | {и́мат} | {гле́дат} | {стре́лят} |

## Ударение в спряжении
Ударение в настоящем времени **не перемещается**: если в форме {аз} оно на окончании ({чета́}), то и во всех формах — на окончании ({чете́ш, чета́т}); если на корне ({пи́ша}) — во всех формах на корне.

| | {съм} быть | {ям} есть (кушать) | {дам} дать | {и́да} пойти |
|---|---|---|---|---|
| аз | {съм} | {ям} | {дам} | {и́да} |
| ти | {си} | {яде́ш} | {даде́ш} | {и́деш} |
| той, тя | {е} | {яде́} | {даде́} | {и́де} |
| ни́е | {сме} | {яде́м} | {даде́м} | {и́дем} |
| ви́е | {сте} | {яде́те} | {даде́те} | {и́дете} |
| те | {са} | {яда́т} | {дада́т} | {и́дат} |

## Отрицание и вопрос
> Не гово́ря бъ́лгарски. = Я не говорю по-болгарски.
> Гово́рите ли ру́ски? = Вы говорите по-русски?
> Не разби́рам. Мо́же ли по-ба́вно? = Не понимаю. Можно помедленнее?
> Къде́ живе́еш? = Где ты живёшь?
> Живе́я във Ва́рна. = Я живу в Варне.

!! Перед словами на **в-** и **ф-** предлог {в} превращается в {във}: {във Ва́рна}, {във Фра́нция}. Перед {с-, з-} предлог {с} становится {със}: {със сестра́ ми}.

## Проверьте себя

Q: «Они читают»: | те чете́т | *те чета́т | те чита́т | те чете́ят :: {чета́т}.
Q: Какого спряжения {гле́дам}? | I | II | *III :: 1-е лицо на -м — III спряжение.
Q: «Ты можешь»: | мо́гаш | *мо́жеш | мо́геш | мо́жиш :: Чередование г/ж: {мо́жеш}.
Q: «Он ест»: | ям | *яде́ | яде́ш | ядат :: {ям — яде́ш — яде́}.
Q: «Я живу в Варне»: | Живе́я в Ва́рна. | *Живе́я във Ва́рна. :: Перед «в» — {във}.
Q: Как сказать «хочу читать»? | И́скам чета́ть. | *И́скам да чета́. | И́скам чете́не. :: Инфинитива нет: {да} + личная форма.

@goal Рассказывать о своём дне, правильно ставить {се} и {си}, говорить, как часто вы что-то делаете.

## Частицы се и си
В болгарском возвратность выражается **отдельным словом**, а не суффиксом «-ся»:
- **се** — действие направлено на себя (= «-ся», «себя»): {ми́я се} — умываюсь;
- **си** — действие для себя, «себе» (дательный): {ми́я си ръце́те} — мою (себе) руки.

> Ка́звам се А́нна. = Меня зовут Анна (букв. «называюсь»).
> Ми́я се. = Я умываюсь.
> Ми́я си зъ́бите. = Я чищу зубы (себе).
> Обли́чам се. = Одеваюсь.
> Купу́вам си кафе́. = Покупаю себе кофе.
> Ля́гам си. = Ложусь спать (иду к себе в постель).
> Оти́вам си. = Ухожу (домой).

## Спряжение: връщам се (возвращаться)
| | Утверждение | Отрицание | Вопрос |
|---|---|---|---|
| аз | {връ́щам се} | {не се́ връ́щам} | {Връ́щам ли се?} |
| ти | {връ́щаш се} | {не се́ връ́щаш} | {Връ́щаш ли се?} |
| той | {връ́ща се} | {не се́ връ́ща} | {Връ́ща ли се?} |
| ни́е | {връ́щаме се} | {не се́ връ́щаме} | {Връ́щаме ли се?} |
| ви́е | {връ́щате се} | {не се́ връ́щате} | {Връ́щате ли се?} |
| те | {връ́щат се} | {не се́ връ́щат} | {Връ́щат ли се?} |

## Место частицы се / си
Частицы безударные и подчиняются тому же правилу, что и {съм}: **не в начале предложения**, обычно **перед глаголом**, если перед ним есть какое-либо слово, и **после глагола**, если глагол стоит первым.
| Глагол первый | Перед глаголом есть слово |
|---|---|
| {Ка́звам се Ива́н.} | {Аз се ка́звам Ива́н.} |
| {Ми́я се.} | {Аз се ми́я.} |
| {Връ́щам се къ́сно.} | {Ве́чер се връ́щам къ́сно.} |

!! Глагол {ста́вам} (вставать) в болгарском **не** возвратный: «Я встаю рано» = {Ста́вам ра́но.}

## Как часто?
W: ви́наги — всегда
W: обикнове́но — обычно
W: че́сто — часто
W: редо́вно — регулярно
W: поня́кога — иногда

W: ря́дко — редко

> Обикнове́но ста́вам в се́дем. = Обычно я встаю в семь.
> Ни́кога не заку́свам. = Я никогда не завтракаю.
> Поня́кога хо́дя на фи́тнес. = Иногда хожу в фитнес.

!! В болгарском, как и в русском, при {ни́кога} нужно отрицание {не}: {Ни́кога не пу́ша.} — Я никогда не курю.

## Текст. {Мо́ят де́н} (Мой день)
> Все́ки де́н се събу́ждам в шест и полови́на. = Каждый день я просыпаюсь в половине седьмого.
> Ста́вам, изми́вам се и си пра́вя кафе́. = Встаю, умываюсь и делаю себе кофе.
> Заку́свам ба́ница с айря́н. = Завтракаю баницей с айраном.
> В о́сем тръ́гвам за ра́бота. = В восемь выхожу на работу.
> Пъту́вам с метро́то два́десет мину́ти. = Еду на метро двадцать минут.
> Рабо́тя до пет. На о́бед обя́двам с коле́гите си. = Работаю до пяти. В обед обедаю с коллегами.
> Ве́чер се приби́рам, вече́рям и чета́. = Вечером возвращаюсь домой, ужинаю и читаю.
> Ля́гам си в едина́йсет. = Ложусь спать в одиннадцать.

## Падежей нет — работают предлоги
В русском значение «где? куда? откуда? кому?» передают падежные окончания. В болгарском существительное не меняется — всю работу делает **предлог**: {в ста́ята} — в комнате / в комнату; {на ма́сата} — на столе / на стол; {на Мари́я} — Марии (кому?) и Марии (чей?).

|---|---|---|
| {в} / {във} | в, внутри | {в ста́ята} — в комнате; {във Ва́рна} — в Варне |
| {на} | на; принадлежность; кому | {на ма́сата}; {кни́гата на Ива́н}; {Да́вам на ма́ма.} |
| {от} | от, из, с | {от Со́фия}; {от се́дем часа́} |
| {до} | до; рядом, у | {до у́тре}; {до прозо́реца} — у окна |
| {с} / {със} | с | {с прия́тел}; {със сестра́ ми} |
| {без} | без | {без за́хар} |
| {за} | для; о; в (направление) | {за теб}; {за ра́бота}; {влак за Пло́вдив} |
| {при} | у (кого-то), при | {при ле́каря} — у врача |
| {по} | по | {по у́лицата}; {по телефо́на} |

## Что такое член
В болгарском есть **определённый артикль** — как английское *the*, только он пишется **слитно, в конце слова**: {стол} — стул (какой-то), {сто́лът} — (этот, известный) стул. В русском такого нет, поэтому это одна из главных тем курса.

> Това́ е кни́га. = Это (какая-то) книга.
> Кни́гата е интере́сна. = (Эта) книга интересная.
> Ви́ждам еди́н мъж. = Я вижу (какого-то) мужчину.
> Мъжъ́т е висо́к. = (Этот) мужчина высокий.

## Формы артикля в единственном числе
| Род и окончание | Артикль | Пример |
|---|---|---|
| м. р., на согласную | **-ът / -а** | {гра́д} → {градъ́т / града́}; {сто́л} → {сто́лът / сто́ла} |
| м. р. на -й | **-ят / -я** | {чай} → {ча́ят / ча́я}; {музе́й} → {музе́ят / музе́я} |
| м. р. на -тел и некоторые другие | **-ят / -я** | {учи́тел} → {учи́телят / учи́теля}; {ле́кар} → {ле́карят / ле́каря}; {ден} → {деня́т / деня́}; {път} → {пъ́тят / пъ́тя}; {кон} → {ко́нят / ко́ня} |
| м. р. на -а / -я | **-та** | {баща́} → {баща́та}; {съдия́} → {съдия́та} |
| м. р. на -о / -е | **-то** | {дя́до} → {дя́дото}; {чи́чо} → {чи́чото} |
| ж. р. на -а / -я | **-та** | {жена́} → {жена́та}; {ста́я} → {ста́ята} |
| ж. р. на согласную | **-та** | {но́щ} → {нощта́}; {про́лет} → {пролетта́}; {любо́в} → {любовта́} |
| ср. р. | **-то** | {легло́} → {легло́то}; {море́} → {море́то}; {такси́} → {такси́то} |

!! Ударение при добавлении артикля может перейти на артикль: {гра́д — градъ́т}, {но́щ — нощта́}, {е́сен — есента́}, {ве́чер — вечерта́}. Сверяйтесь со словарём приложения — там все формы с артиклем указаны с ударением.

## Полный и краткий член мужского рода
У существительных мужского рода **две формы**: полная ({-ът, -ят}) и краткая ({-а, -я}). Произносятся они почти одинаково, разница — правило письма:
- **полный член** ставится, если слово — **подлежащее** (или именная часть после {съм}): {Сто́лът е но́в.}
- **краткий член** — во всех остальных случаях: после предлога, в дополнении: {Ся́дам на сто́ла.} {Ви́ждам сто́ла.}

?? Проверка: замените слово местоимением. Если подходит {то́й} (он) — пишем полный член; если {не́го} (его) — краткий. {Учи́телят (= то́й) е тук.} — {Ви́ждам учи́теля (= не́го).}

> Хоте́лът е бли́зо. = Гостиница близко. (подлежащее)
> Оти́вам в хоте́ла. = Иду в гостиницу. (после предлога)
> Ле́карят е мно́го любе́зен. = Врач очень любезный.
> Пи́там ле́каря. = Спрашиваю врача.
> Деня́т е слъ́нчев. = День солнечный.
> През деня́ рабо́тя. = Днём я работаю.

## Когда нужен артикль
1. Предмет **известен** собеседникам или уже упоминался: {Ку́пих кни́га. Кни́гата е интере́сна.}
2. Предмет **единственный** в ситуации или в мире: {слъ́нцето}, {луна́та}, {президе́нтът}, {ку́хнята} (в нашей квартире).
3. Обобщённое понятие — **весь класс**: {Ку́чето е прия́тел на чове́ка.} — Собака — друг человека.
4. После предлога, если речь о конкретном месте: {в ста́ята}, {на га́рата}.

## Когда артикль не нужен
- Имена собственные: {Со́фия}, {Мари́я}, {Бълга́рия} (но: {Со́фия е сто́лица на Бълга́рия}).
- Предмет **новый**, впервые упомянутый, или «какой-то»: {И́мам кола́.}
- После {и́мам / ня́мам / и́ма / ня́ма} в общем смысле: {Ня́мам вре́ме.}
- Профессия после {съм}: {Тя е ле́карка.}
- С краткими притяжательными местоимениями при названиях родственников в ед. ч.: {ма́йка ми}, {баща́ ти} (урок 21).

## Текст. Габрово и габровцы
Габровцы в Болгарии — герои анекдотов о бережливости (как шотландцы в Англии).
> Га́брово е ма́лък гра́д в Бълга́рия. = Габрово — небольшой город в Болгарии.
> Градъ́т е изве́стен с Къ́щата на ху́мора и сати́рата. = Город известен Домом юмора и сатиры.
> Га́бровците са изве́стни като́ пестели́ви хо́ра. = Габровцы известны как бережливые люди.
> Те ка́зват: „Вре́мето е пари́“. = Они говорят: «Время — деньги».

## Артикль ставится на первое слово
В болгарском артикль присоединяется к **первому изменяемому слову** именной группы — обычно к прилагательному:
| Без артикля | С артиклем |
|---|---|
| {но́в гра́д} | {но́вият гра́д} |
| {но́ва къ́ща} | {но́вата къ́ща} |
| {но́во легло́} | {но́вото легло́} |
| {но́ви хо́ра} | {но́вите хо́ра} |
| {мно́го ху́бава ста́я} | {мно́го ху́бавата ста́я} |

## Формы прилагательных с артиклем
| Род | Без артикля | Полный член | Краткий член |
|---|---|---|---|
| м. р. | {но́в} | {но́вият} | {но́вия} |
| ж. р. | {но́ва} | {но́вата} | — |
| ср. р. | {но́во} | {но́вото} | — |
| мн. ч. | {но́ви} | {но́вите} | — |

Мужской род: к форме прилагательного добавляется **-ият / -ия**; если прилагательное оканчивается на **-и** ({бъ́лгарски}) — **-ят / -я**: {бъ́лгарският / бъ́лгарския}. Беглая гласная выпадает, перегласовка я/е действует: {до́бър → добри́ят}, {бял → бе́лият}, {голя́м → голе́мият}, {ма́лък → ма́лкият}.

> Голе́мият гра́д ми харе́сва. = Мне нравится большой город.
> Живе́я в голе́мия гра́д. = Я живу в большом городе.
> Бе́лият ко́тарак спи. = Белый кот спит.
> Ста́рата къ́ща е на дя́до ми. = Старый дом — моего дедушки.
> Ма́лкото моми́че пла́че. = Маленькая девочка плачет.

!! Правила полного и краткого члена у прилагательных те же: {Голе́мият стол е тук.} — {Ся́дам на голе́мия стол.}

## Порядковые числительные и притяжательные местоимения
Они ведут себя как прилагательные: {пъ́рвият уро́к}, {пъ́рвата ста́я}; {мо́ят брат}, {мо́ята сестра́}, {на́шият дом}.

## Неопределённый артикль: един, една, едно
Числительное «один» часто играет роль неопределённого артикля («какой-то, один»):
| м. р. | ж. р. | ср. р. | мн. ч. |
|---|---|---|---|
| {еди́н} | {една́} | {едно́} | {едни́} |

> Ви́дях еди́н интере́сен фи́лм. = Я посмотрел один (какой-то) интересный фильм.
> Една́ жена́ те ча́ка. = Тебя ждёт какая-то женщина.
> И́мам едно́ предложе́ние. = У меня есть одно предложение.

?? {еди́н} обычно опускается, если важен не «какой-то предмет», а сам факт: {И́мам кола́.} — У меня есть машина. С {еди́н} подчёркивается «один, некий»: {И́мам еди́н въпро́с.}

## Который час?
> Ко́лко е часъ́т? = Который час?
> Часъ́т е пет. = Пять часов.
> Пет и де́сет. = Пять десять.
> Пет и петна́десет. / Пет и че́твърт. = Пять пятнадцать. Четверть шестого.
> Пет и полови́на. = Половина шестого (пять тридцать).
> Шест без два́десет. = Без двадцати шесть.
> Шест без че́твърт. = Без четверти шесть.
> То́чно о́сем. = Ровно восемь.
> Двана́десет часа́ на о́бед. = Двенадцать часов дня, полдень.

!! В отличие от русского «половина шестого», болгары говорят **{пет и полови́на}** — «пять с половиной». Минуты прибавляют к прошедшему часу ({и}) или отнимают от следующего ({без}).

## В котором часу?
> В ко́лко часа́ запо́чва фи́лмът? = Во сколько начинается фильм?
> В се́дем и полови́на. = В половине восьмого.
> От де́вет до пет часа́. = С девяти до пяти.
> Ще те ча́кам в шест часа́ пред теа́търа. = Буду ждать тебя в шесть часов у театра.
> Сре́щата е в 14:30 (четирина́десет и три́десет). = Встреча в 14:30.

?? В официальной речи (транспорт, телевидение) используют 24-часовой формат: {два́десет и еди́н часа́} — 21:00.

## Два артикля множественного числа
| Мн. ч. оканчивается на | Артикль | Примеры |
|---|---|---|
| **-и, -е** | **-те** | {жени́ — жени́те}, {столо́ве — столо́вете}, {мъже́ — мъже́те}, {ле́кари — ле́карите} |
| **-а, -я** | **-та** | {деца́ — деца́та}, {легла́ — легла́та}, {крака́ — крака́та}, {хо́ра — хо́рата}, {моря́ — моря́та} |

Полного и краткого члена во множественном числе **нет** — форма одна.

> Деца́та игра́ят в дво́ра. = Дети играют во дворе.
> Кни́гите са на ра́фта. = Книги на полке.
> Хо́рата тук са мно́го любе́зни. = Люди здесь очень любезные.
> Столо́вете са в ку́хнята. = Стулья на кухне.
> Писма́та са на бюро́то. = Письма на письменном столе.

## Прилагательные во множественном числе
Одна форма для всех родов: **-и** + артикль **-те**:
| Без артикля | С артиклем |
|---|---|
| {но́ви къ́щи} | {но́вите къ́щи} |
| {голе́ми градове́} | {голе́мите градове́} |
| {ма́лки деца́} | {ма́лките деца́} |
| {бъ́лгарски ду́ми} | {бъ́лгарските ду́ми} |
> Голе́мите градове́ са шу́мни. = Большие города шумные.
> Ста́рите къ́щи в Пло́вдив са мно́го краси́ви. = Старые дома в Пловдиве очень красивые.

@goal Правильно употреблять краткие формы местоимений «меня, мне, его, ему…», ставить их на нужное место и строить фразы «мне нравится», «мне холодно», «у меня болит».

## Таблица форм
| Кто | Кого? (полная) | Кого? (краткая) | Кому? (полная) | Кому? (краткая) |
|---|---|---|---|---|
| {аз} | {ме́не / мен} | {ме} | {на ме́не / на мен} | {ми} |
| {ти} | {те́бе / теб} | {те} | {на те́бе / на теб} | {ти} |
| {той} | {не́го} | {го} | {на не́го} | {му} |
| {тя} | {не́я} | {я} | {на не́я} | {ѝ} |
| {то} | {не́го} | {го} | {на не́го} | {му} |
| {ни́е} | {нас} | {ни} | {на нас} | {ни} |
| {ви́е} | {вас} | {ви} | {на вас} | {ви} |
| {те} | {тях} | {ги} | {на тях} | {им} |

?? В болгарском сохранились остатки падежей только у местоимений: «кого?» (винительный) и «кому?» (дательный). Существительные же не склоняются.

## Краткие формы — основные
В обычной речи используются **краткие** формы. Полные — после предлогов и когда на местоимение падает логическое ударение.
> Ви́ждам те. = Я тебя вижу.
> Оби́чам те. = Я тебя люблю.
> Чу́ваш ли ме? = Ты меня слышишь?
> Ка́звам му. = Говорю ему.
> Да́вам ѝ кни́гата. = Даю ей книгу.
> Пи́ша им писмо́. = Пишу им письмо.
> Мо́жеш ли да ми помо́гнеш? = Ты можешь мне помочь?

## Полные формы
> Това́ е за те́бе. = Это для тебя.
> Ела́ с нас! = Пойдём с нами!
> Ти́ ли го видя́? — Не, не́го не го́ видя́х. = Это ты его видел? — Нет, его я не видел.
> На ме́не ми харе́сва, а на не́го — не. = Мне нравится, а ему — нет.

## Место кратких форм
Краткие местоимения — **безударные** (как {съм} и {се}): они не могут стоять в начале предложения.
| Ситуация | Пример |
|---|---|
| перед глаголом есть слово | {Аз те ви́ждам.} {Ве́че го зна́я.} |
| глагол — первое слово | {Ви́ждам те.} {Зна́я го.} |
| после {не} (получает ударение) | {Не те́ ви́ждам.} {Не го́ зна́я.} |
| с {ще} | {Ще ти се оба́дя.} {Ще го ку́пя.} |
| с {да} | {И́скам да го ку́пя.} |
| в повелительном наклонении — после глагола | {Кажи́ ми!} {Да́й ми го!} {Покажи́ ми!} |
| в вопросе с {ли} | {Ви́ждаш ли ме?} {Ще ми се оба́диш ли?} |

## Две краткие формы подряд
Сначала «кому?», затем «кого/что?»: **ми + го**.
> Да́й ми го! = Дай мне его!
> Ще ти я пока́жа. = Я тебе её покажу.
> Ка́за ли му го? = Ты ему это сказал?
> Не ми́ го да́вай! = Не давай мне его!

## Удвоенное дополнение
Очень болгарская особенность: если дополнение стоит **перед** глаголом (или его хотят выделить), оно «повторяется» краткой формой местоимения:
> Кни́гата я проче́тох. = Книгу я (уже) прочитала.
> Ива́н го позна́вам отда́вна. = Ивана я знаю давно.
> На Мари́я ѝ се оба́дих. = Марии я позвонил.
> Ме́не ме боли́ глава́та. = У меня болит голова.

## Безличные конструкции с местоимениями
| Болгарский | Русский |
|---|---|
| {Харе́сва ми.} | Мне нравится. |
| {Харе́сват ми.} | Мне нравятся. |
| {Студе́но ми е.} | Мне холодно. |
| {То́пло ми е.} | Мне тепло. |
| {Ску́чно ми е.} | Мне скучно. |
| {Жа́л ми е.} | Мне жаль. |
| {Прия́тно ми е.} | Мне приятно. |
| {Спи ми се.} | Мне хочется спать. |
| {Яде́ ми се.} | Мне хочется есть. |
| {Боли́ ме глава́та.} | У меня болит голова. |
| {Боля́т ме крака́та.} | У меня болят ноги. |
| {Стра́х ме е.} | Мне страшно. |
| {Срам ме е.} | Мне стыдно. |

!! Обратите внимание: «нравится» — {харе́свам}: дословно «я нахожу приятным». Поэтому можно сказать и {Харе́свам те.} (Ты мне нравишься), и {Харе́сваш ми.} (то же самое).

## Проверьте себя
Q: «Я тебя вижу»: | Те ви́ждам. | *Ви́ждам те. | Ви́ждам тебе́. :: Краткая форма не стоит в начале.
Q: «Дай мне его!»: | Да́й го ми! | *Да́й ми го! | Ми го да́й! :: Порядок: «кому» + «что»: {ми го}.
Q: «Ей» (краткая форма): | я | *ѝ | и :: {ѝ} пишется со знаком.
Q: «Мне холодно»: | Аз съм студе́н. | *Студе́но ми е. | Студе́но ме е. :: Безличная конструкция с {ми}.

Q: «Я его не знаю»: | Не зна́я го. | *Не го́ зна́я. :: После {не} краткая форма перед глаголом и под ударением.

| их | {те́хен} | {тя́хна} | {тя́хно} | {те́хни} |

С артиклем: {мо́ят / мо́я}, {мо́ята}, {мо́ето}, {мо́ите}; {на́шият / на́шия}, {на́шата}; {те́хният}, {тя́хната} и т. д.
> Това́ е мо́ят брат. = Это мой брат.
> Мо́ята ста́я е ма́лка. = Моя комната маленькая.
> Не́говата кола́ е но́ва. = Его машина новая.
> На́шите прия́тели са от Пло́вдив. = Наши друзья из Пловдива.

!! Полная форма употребляется **с артиклем**, если стоит перед существительным: {мо́ята кни́га} (а не «моя книга» без артикля).

## Краткие формы
| | мой | твой | его | её | наш | ваш | их | свой |
|---|---|---|---|---|---|---|---|---|
| краткая | {ми} | {ти} | {му} | {ѝ} | {ни} | {ви} | {им} | {си} |

Краткая форма ставится **после** существительного, которое получает **артикль**:
> кни́гата ми = моя книга
> ста́ята ти = твоя комната
> кола́та му = его машина
> ро́клята ѝ = её платье
> къ́щата ни = наш дом
> прия́телите им = их друзья

Обе формы равноправны, но краткая — разговорнее и встречается чаще: {Ста́ята ми е ма́лка.} = {Мо́ята ста́я е ма́лка.}

## Названия родственников — без артикля
С краткой формой названия **близких родственников в единственном числе** употребляются **без артикля**:
| Правильно | Перевод |
|---|---|
| {ма́йка ми} | моя мама |
| {баща́ ми} | мой папа |
| {брат ми} | мой брат |
| {сестра́ ми} | моя сестра |
| {син ми}, {дъщеря́ ми} | мой сын, моя дочь |
| {мъж ми}, {жена́ ми} | мой муж, моя жена |
| {ба́ба ми}, {дя́до ми} | моя бабушка, мой дедушка |
| {ле́ля ми}, {чи́чо ми} | моя тётя, мой дядя |
Но во множественном числе — с артиклем: {роди́телите ми}, {бра́тята ми}, {деца́та ми}.

## Возвратное «свой» — си
Если обладатель — подлежащее того же предложения, вместо {му, ѝ, им} используется **си** (свой):
> Мари́я оби́ча ма́йка си. = Мария любит свою маму.
> Ива́н чете́ кни́гата си. = Иван читает свою книгу.
> Те оби́чат деца́та си. = Они любят своих детей.
Сравните: {Мари́я оби́ча ма́йка ѝ.} — Мария любит её маму (другой женщины).

## Вместо инфинитива — да + личная форма
Поскольку инфинитива нет, второй глагол ставится в **той же личной форме**, что и первый (если субъект один), с частицей {да}:
| Русский | Болгарский |
|---|---|
| Я хочу читать. | {И́скам да чета́.} |
| Ты хочешь читать. | {И́скаш да чете́ш.} |
| Он может прийти. | {То́й мо́же да до́йде.} |
| Мы любим путешествовать. | {Ни́е оби́чаме да пъту́ваме.} |
| Вы умеете плавать? | {Мо́жете ли да плу́вате?} |
| Они начинают работать. | {Те запо́чват да рабо́тят.} |

Если субъекты **разные**, конструкция та же, а по-русски будет «чтобы»:
> И́скам да до́йдеш. = Я хочу, чтобы ты пришёл.
> Ма́ма и́ска да у́ча. = Мама хочет, чтобы я учился.

## Модальные глаголы
| Глагол | Значение | Пример |
|---|---|---|
| {и́скам да} | хотеть | {И́скам да спя.} |
| {мо́га да} | мочь, уметь | {Мо́га да гово́ря бъ́лгарски.} |
| {тря́бва да} | надо, должен (безличн.) | {Тря́бва да тръ́гвам.} |
| {мо́же да} | можно; может быть (безличн.) | {Мо́же ли да вля́за?} {Мо́же да вали́.} |
| {не би́ва да} | нельзя, не следует | {Не би́ва да пу́шиш.} |
| {оби́чам да} | любить (делать) | {Оби́чам да пе́я.} |
| {запо́чвам да} | начинать | {Запо́чвам да разби́рам.} |
| {опи́твам се да} | стараться, пытаться | {Опи́твам се да запо́мня.} |
| {у́ча се да} | учиться (делать что-то) | {У́ча се да ка́рам кола́.} |
| {надя́вам се да} | надеяться | {Надя́вам се да се ви́дим.} |

!! {Тря́бва} и {мо́же} (в значении «можно») — **безличные**, не меняются по лицам: {аз тря́бва}, {ти тря́бва}, {те тря́бва}. Лицо показывает второй глагол: {Тря́бва да тръ́гваме.} — Нам пора идти.

> Ха́йде да вече́ряме! = Давай поужинаем!

## Текст. Как надо учить иностранный язык

> Тря́бва да слу́шаш, да чете́ш и да гово́риш. = Нужно слушать, читать и говорить.
> Не би́ва да се страху́ваш от гре́шки. = Нельзя бояться ошибок.
> Мо́жеш да гле́даш фи́лми с субти́три. = Можно смотреть фильмы с субтитрами.
> Ва́жно е да повта́ряш ду́мите. = Важно повторять слова.

## Проверьте себя

Q: «Мы должны идти»: | Тря́бваме да тръ́гваме. | *Тря́бва да тръ́гваме. :: {тря́бва} не изменяется.
Q: «Я хочу, чтобы ты пришёл»: | И́скам ти да до́йдеш. | *И́скам да до́йдеш. | И́скам да до́йда. :: Разный субъект — форма 2-го лица.
Q: «Здесь нельзя курить»: | Тук не мо́же пу́ши. | *Тук не би́ва да се пу́ши. :: {не би́ва да}.
Q: «Можно войти?»: | Мо́га ли вля́за? | *Мо́же ли да вля́за? :: Вежливая просьба — {Мо́же ли да…?}

## Два вида — как в русском
Как и в русском, у болгарских глаголов два вида:
- **несовершенный (НСВ)** — процесс, повторение, длительность: {купу́вам} — покупаю;
- **совершенный (СВ)** — один законченный результат: {ку́пя} — куплю.

## Главное правило: СВ в настоящем времени
В отличие от русского, **совершенный вид в настоящем времени не употребляется самостоятельно**. «Я куплю» — это будущее время ({ще ку́пя}, урок 25). Форма {ку́пя} без {ще} возможна только после **да, ако, кога́то, щом, преди́ да, след като́** и подобных слов:
> И́скам да ку́пя хля́б. = Я хочу купить хлеб.
> Ако́ ку́пиш хля́б, оба́ди ми се. = Если купишь хлеб, позвони мне.
> Кога́то свъ́рша ра́бота, ще ти се оба́дя. = Когда закончу работу, позвоню тебе.
> Все́ки де́н купу́вам хля́б. = Каждый день покупаю хлеб.

## Вид в будущем времени и в повелительном наклонении
> Ще ку́пя хля́б. = Я куплю хлеб (один раз).
> Ще купу́вам хля́б все́ки де́н. = Я буду покупать хлеб каждый день.
> Купи́ хля́б! = Купи хлеб!
> Не купу́вай хля́б! = Не покупай хлеб!
!! В **отрицательном** повелительном наклонении употребляется только **НСВ**: {Не купу́вай!}, {Не затва́ряй!}, {Не ка́звай!} — никогда «не купи́», «не затвори́».

## Проверьте себя

Q: «Я хочу купить билет»: | И́скам да купу́вам биле́т. | *И́скам да ку́пя биле́т. :: Одно законченное действие — СВ после {да}.
Q: «Не закрывай окно!»: | Не затво́ряй прозо́реца! | *Не затва́ряй прозо́реца! :: Запрет — только НСВ.
Q: Пара к {да́вам}: | да́вам — дава́м | *дам | дади́ :: {да́вам — дам}.
Q: Пара к {и́двам}: | и́да | *до́йда | оти́да :: {и́двам — до́йда}.
Q: Можно ли сказать «Аз ку́пя хля́б» (без да, ще, ако…)? | Да | *Нет :: СВ в настоящем времени самостоятельно не употребляется.

## Образование: ще + форма настоящего времени
Будущее время образуется очень просто: неизменяемая частица **ще** + глагол в форме настоящего времени.
| | {чета́} (НСВ) | {прочета́} (СВ) |
|---|---|---|
| аз | {ще чета́} | {ще прочета́} |
| ти | {ще чете́ш} | {ще прочете́ш} |
| той, тя | {ще чете́} | {ще прочете́} |
| ни́е | {ще чете́м} | {ще прочете́м} |
| ви́е | {ще чете́те} | {ще прочете́те} |
| те | {ще чета́т} | {ще прочета́т} |

> У́тре ще оти́да на море́. = Завтра я поеду на море.
> Ще ти се оба́дя дове́чера. = Позвоню тебе сегодня вечером.
> Ще у́ча бъ́лгарски все́ки де́н. = Я буду учить болгарский каждый день.

?? {ще} — бывшая форма глагола «хотеть» ({ща}). Сравните русское диалектное «хочу пойти» = «пойду».

## Отрицание: няма да
Отрицательная форма — **ня́ма да** + настоящее время (а не «не ще»):
| Утверждение | Отрицание |
|---|---|
| {Ще до́йда.} — Я приду. | {Ня́ма да до́йда.} — Я не приду. |
| {Ще ку́пя кола́.} | {Ня́ма да ку́пя кола́.} |
| {Ще се оба́дя.} | {Ня́ма да се оба́дя.} |

> Кога́ ще се въ́рнеш? = Когда ты вернёшься?
> Ня́ма ли да яде́ш? = Ты не будешь есть?

| ти | {ще бъ́деш / ще си} | {ще и́маш} |

## Место кратких форм при «ще»
Краткие формы ({се}, {ми}, {го}…) стоят **между ще и глаголом**:

> Ще ти го да́м. = Я тебе его дам.
> Ня́ма да ти го да́м. = Я тебе его не дам.

## Сравнительная и превосходная степень
В болгарском степени сравнения образуются **одинаково для всех** прилагательных и наречий — частицами **по́-** и **на́й-** (через дефис; частица сама несёт ударение):
| Положительная | Сравнительная | Превосходная |
|---|---|---|
| {голя́м} — большой | {по́-голя́м} — больше, крупнее | {на́й-голя́м} — самый большой |
| {ху́бава} — красивая | {по́-ху́бава} | {на́й-ху́бава} |
| {интере́сно} | {по́-интере́сно} | {на́й-интере́сно} |
| {бъ́рзо} — быстро | {по́-бъ́рзо} — быстрее | {на́й-бъ́рзо} — быстрее всего |
| {ра́но} — рано | {по́-ра́но} — раньше | {на́й-ра́но} |

Исключений почти нет: {до́бър — по́-до́бър — на́й-до́бър}, {добре́ — по́-добре́ — на́й-добре́}, {мно́го — по́вече — на́й-мно́го}, {ма́лко — по́-ма́лко — на́й-ма́лко}.

!! «Больше» (о количестве) — {по́вече}: {И́скам по́вече вре́ме.} А «больше» (о размере) — {по́-голя́м}.

## С кем сравниваем: от, отколкото
> Со́фия е по́-голя́ма от Пло́вдив. = София больше Пловдива.
> Брат ми е по́-висо́к от ме́не. = Мой брат выше меня.
> Днес е по́-то́пло, отко́лкото вче́ра. = Сегодня теплее, чем вчера.
> Тя е на́й-у́мната студе́нтка в гру́пата. = Она самая умная студентка в группе.
> Това́ е на́й-ху́бавият де́н в живо́та ми. = Это самый прекрасный день в моей жизни.

@goal Говорить о прошлом с самыми частыми глаголами: «был», «было», «у меня было», «там не было».

## Глагол «съм» в прошедшем времени
| | Ед. ч. | Мн. ч. |
|---|---|---|
| 1 | {аз бях} — я был(а) | {ни́е бя́хме} |
| 2 | {ти бе́ше} | {ви́е бя́хте} |
| 3 | {той, тя, то бе́ше} | {те бя́ха} |

?? В книжной речи и в стихах 2–3 лицо иногда сокращается до {бе}: {То́й бе тук.}

> Вче́ра бях на ра́бота. = Вчера я был(а) на работе.
> Къде́ бе́ше сно́щи? = Где ты был(а) вчера вечером?
> Ни́е бя́хме в Бълга́рия ми́налото ля́то. = Мы были в Болгарии прошлым летом.
> Фи́лмът бе́ше мно́го интере́сен. = Фильм был очень интересный.
> Те не бя́ха вкъ́щи. = Их не было дома.

!! В отличие от русского, связка в прошедшем времени не меняется по родам: {аз бях} — и «я был», и «я была».

## Глагол «имам» в прошедшем
| | имел | не имел |
|---|---|---|
| аз | {и́мах} | {ня́мах} |
| ти | {и́маше} | {ня́маше} |
| той, тя | {и́маше} | {ня́маше} |
| ни́е | {и́махме} | {ня́махме} |
| ви́е | {и́махте} | {ня́махте} |
| те | {и́маха} | {ня́маха} |

> Като́ дете́ и́мах ку́че. = В детстве у меня была собака.
> Ня́мах вре́ме да ти се оба́дя. = У меня не было времени тебе позвонить.

## Безличное «было / не было» — имаше / нямаше
> Вче́ра и́маше мно́го хо́ра на площа́да. = Вчера на площади было много людей.
> В магази́на ня́маше хля́б. = В магазине не было хлеба.
> Ня́маше никого́ вкъ́щи. = Дома никого не было.

## Диалог. {Къде́ бе́ше вче́ра?}
D: Ми́ла: Къде́ бе́ше вче́ра? Цял де́н те тъ́рсих. = Где ты была вчера? Я весь день тебя искала.
D: Ро́си: Бях при ба́ба си на се́ло. = Я была у бабушки в деревне.
D: Ми́ла: И как бе́ше? = И как было?
D: Ро́си: Мно́го ху́баво! Вре́мето бе́ше то́пло и и́маше мно́го плодове́. = Очень хорошо! Погода была тёплая, и было много фруктов.
D: Ми́ла: А и́маше ли интерне́т? = А интернет был?
D: Ро́си: Не, ня́маше. Затова́ не ти отгово́рих. = Нет, не было. Поэтому я тебе не ответила.

## Что такое аорист
**Аорист** ({ми́нало свъ́ршено вре́ме}) — главное повествовательное прошедшее время: законченное действие в конкретный момент прошлого, событие в рассказе. Чаще всего это глаголы СВ, но и НСВ тоже возможны: {Вче́ра ку́пих хля́б.} (СВ) — {Вче́ра два ча́са че́тох.} (НСВ: читал(а) два часа).

## Окончания — одинаковые для всех глаголов
| | Ед. ч. | Мн. ч. |
|---|---|---|
| 1 | **-х** | **-хме** |
| 2 | — (основа) | **-хте** |
| 3 | — (основа) | **-ха** |

Разница между глаголами — только в **гласном перед -х**: -ах/-ях, -их, -ох, -ех/-ух.

## Типы основ аориста

| | {ви́дя} | {видя́х} | {видя́} | {видя́ха} |

## Текст. {Вче́рашният де́н} (часть I)
> Вче́ра ста́нах ра́но. = Вчера я встала рано.
> Заку́сих набъ́рзо и оти́дох на ра́бота. = Быстро позавтракала и пошла на работу.
> На о́бед сре́щнах една́ ста́ра прия́телка. = В обед встретила старую подругу.
> Оти́дохме в кафене́ и гово́рихме це́лия ча́с. = Мы пошли в кафе и проговорили целый час.
> След ра́бота ку́пих си но́ва ро́кля. = После работы купила себе новое платье.
> Вечерта́ гле́дах фи́лм и ле́гнах си къ́сно. = Вечером посмотрела фильм и поздно легла спать.

> Какво́ пра́ви вче́ра? = Что ты делал вчера?
> Къде́ хо́ди? = Где ты был (куда ходил)?
> Кога́ присти́гнахте? = Когда вы приехали?
> Видя́ ли Ива́н? = Ты видел Ивана?
> Ка́за ли му? = Ты ему сказал?

@goal Различать два прошедших времени: событие (аорист) и фон, процесс, привычку (имперфект).

## Образование имперфекта
Имперфект ({ми́нало несвъ́ршено вре́ме}) образуется от **основы настоящего времени**:
| Тип | Наст. время | Имперфект (аз) | (ти, той) | (те) |
|---|---|---|---|---|
| ударное окончание (I, II спр.) | {чета́} | {четя́х} | {чете́ше} | {четя́ха} |
| | {вървя́} | {вървя́х} | {върве́ше} | {вървя́ха} |
| после ж, ш, ч | {лежа́} | {лежа́х} | {леже́ше} | {лежа́ха} |
| ударная основа (I, II спр.) | {пи́ша} | {пи́шех} | {пи́шеше} | {пи́шеха} |
| | {гово́ря} | {гово́рех} | {гово́реше} | {гово́реха} |
| | {живе́я} | {живе́ех} | {живе́еше} | {живе́еха} |
| III спряжение | {гле́дам} | {гле́дах} | {гле́даше} | {гле́даха} |
| | {и́мам} | {и́мах} | {и́маше} | {и́маха} |

Окончания: **-х, -ше, -ше, -хме, -хте, -ха**. 2-е и 3-е лицо — всегда на **-ше**.

?? У глаголов III спряжения формы аориста и имперфекта совпадают в 1-м лице ({гле́дах}), но различаются во 2–3-м: аорист {гле́да}, имперфект {гле́даше}.

## Когда имперфект
1. **Фон, процесс** в прошлом, на котором происходит событие: {Кога́то вля́зох, тя гово́реше по телефо́на.}
2. **Повторяющееся, привычное** действие: {Вся́ко ля́то хо́дехме на море́.}
3. **Описание** обстановки, погоды, внешности: {Вале́ше дъжд и ду́хаше си́лен вя́тър.}
4. После {ако́}, {кога́то}, {да} в прошлом (в том числе у СВ): {Кога́то се въ́рнеше от ра́бота, ведна́га ля́гаше да спи.} — Когда он возвращался с работы, сразу ложился спать.

## Когда аорист
1. **Событие**, законченное действие, факт: {Вля́зох в ста́ята.}
2. **Цепочка событий**: {Ста́нах, изми́х се и изля́зох.}
3. Действие, ограниченное во времени: {Рабо́тих там две годи́ни.}

## Сравните
| Аорист | Имперфект |
|---|---|
| {Вче́ра че́тох една́ кни́га.} — Вчера я прочитал(а) книгу. | {Вче́ра четя́х, кога́то ти се оба́ди.} — Вчера я читал(а), когда ты позвонил. |
| {Валя́ це́лия де́н.} — Дождь шёл весь день (и закончился). | {Вале́ше дъжд.} — Шёл дождь (фон). |
| {Ку́пих хля́б.} — Купил хлеб. | {Все́ки де́н купу́вах хля́б.} — Каждый день покупал хлеб. |

## Текст. {Кога́то бях ма́лка}
> Кога́то бях ма́лка, живе́ехме в ма́лък гра́д. = Когда я была маленькой, мы жили в маленьком городе.
> Вся́ка су́трин ста́вах в се́дем и хо́дех на учи́лище пеша́. = Каждое утро я вставала в семь и ходила в школу пешком.
> Ба́ба ми ни гле́даше и ни го́твеше вку́сно я́дене. = Бабушка присматривала за нами и готовила нам вкусную еду.
> Вечерта́ ни чете́ше при́казки. = Вечером она читала нам сказки.
> Еди́н де́н, кога́то се връ́щах от учи́лище, видя́х ма́лко ко́те. = Однажды, когда я возвращалась из школы, я увидела маленького котёнка.
> Взех го вкъ́щи и то живя́ при нас петна́десет годи́ни. = Я забрала его домой, и он прожил у нас пятнадцать лет.

## Проверьте себя
Q: Имперфект от {чета́} (той): | че́те | *чете́ше | че́теше :: {чете́ше}.
Q: «Когда я вошёл, она говорила по телефону»: | Кога́то вли́зах, тя гово́ри… | *Кога́то вля́зох, тя гово́реше… :: Событие — аорист, фон — имперфект.
Q: «Каждое лето мы ездили на море»: | Вся́ко ля́то хо́дихме на море́. | *Вся́ко ля́то хо́дехме на море́. :: Повторение — имперфект.
Q: «Шёл дождь» (описание фона): | Валя́ дъжд. | *Вале́ше дъжд. :: Фон — имперфект.
Q: Имперфект от {и́мам} (ти): | и́ма | *и́маше | и́мах :: {и́маше}.

## Причастие на -л (аористное)
Образуется от **основы аориста**: вместо **-х** ставим **-л** (м. р.), **-ла** (ж. р.), **-ло** (ср. р.), **-ли** (мн. ч.).

| {оти́дох} | {оти́шъл} | {оти́шла} | {оти́шло} | {оти́шли} |
| {я́дох} | {ял} | {я́ла} | {я́ло} | {я́ли} |

!! Основа на **-т, -д** перед -л выпадает: {че́тох → чел}, {да́дох → дал}. Основа на другой согласный получает **-ъл**: {доне́сох → доне́съл}, {пе́кох → пе́къл}. **-я́л** во мн. ч. переходит в **-е́ли**: {видя́л — виде́ли}, {живя́л — живе́ли}.

## Перфект: съм + причастие
Перфект ({ми́нало неопределе́но вре́ме}) = настоящее время {съм} + причастие на -л:
| | м. р. | ж. р. |
|---|---|---|
| аз | {чел съм} / {аз съм чел} | {че́ла съм} |
| ти | {чел си} | {че́ла си} |
| той / тя | {чел е} | {че́ла е} |
| ни́е | {че́ли сме} | {че́ли сме} |
| ви́е | {че́ли сте} | {че́ли сте} |
| те | {че́ли са} | {че́ли са} |

## Когда перфект
1. **Жизненный опыт** (неважно когда): {Би́л съм в Бълга́рия три пъ́ти.} — Я был в Болгарии три раза.
2. **Результат**, важный сейчас: {Изгу́бил съм си ключо́вете.} — Я потерял ключи (и сейчас их нет).
3. Действие в прошлом **без указания времени**: {Че́л ли си „Под и́гото“?} — Ты читал «Под игом»?

Сравните с аористом: {Вче́ра бях в Со́фия.} (когда — указано) — {Би́л съм в Со́фия.} (опыт, когда — неважно).

## Отрицание и вопрос
> Не съ́м бил в Бълга́рия. = Я не был в Болгарии.
> Ни́кога не съ́м пи́л раки́я. = Я никогда не пил ракию.
> Я́ла ли си ба́ница? = Ты ела баницу?
> Ви́ждал ли си море́то? = Ты видел (когда-нибудь) море?
> Къде́ си била́? = Где ты была?

## Порядок слов
Как и {съм}, вспомогательный глагол — безударный: {Чел съм.} / {Аз съм чел.} / {Не съ́м чел.} / {Чел ли си?}

## Диалог. {Била́ ли си в Бълга́рия?}
D: Ни́на: Била́ ли си в Бълга́рия? = Ты была в Болгарии?
D: О́ля: Да, била́ съм два пъ́ти — на море́ и в Со́фия. = Да, была два раза — на море и в Софии.
D: Ни́на: А в Пло́вдив? = А в Пловдиве?
D: О́ля: Не, не съ́м била́. Ка́зват, че е мно́го краси́в. = Нет, не была. Говорят, что он очень красивый.
D: Ни́на: Да, а Ста́рият гра́д е уника́лен! = Да, а Старый город уникален!

## Плюсквамперфект (минало предварително време)
**бях + причастие на -л** — действие, которое произошло **раньше другого прошедшего**:
> Кога́то присти́гнах на га́рата, вла́кът ве́че бе́ше тръ́гнал. = Когда я приехал на вокзал, поезд уже ушёл.
> Тя бе́ше проче́ла кни́гата преди́ фи́лма. = Она прочитала книгу ещё до фильма.
> Не бя́хме се ви́ждали от годи́ни. = Мы не виделись годами.

## Будущее в прошедшем (бъдеще време в миналото)
**щях да + настоящее время** — «собирался, должен был»; также нереальное действие («сделал бы»):
| | Утверждение | Отрицание |
|---|---|---|
| аз | {щях да до́йда} | {ня́маше да до́йда} |
| ти | {ще́ше да до́йдеш} | {ня́маше да до́йдеш} |
| той | {ще́ше да до́йде} | {ня́маше да до́йде} |
| ни́е | {щя́хме да до́йдем} | {ня́маше да до́йдем} |
| ви́е | {щя́хте да до́йдете} | {ня́маше да до́йдете} |
| те | {щя́ха да до́йдат} | {ня́маше да до́йдат} |
> Щях да ти се оба́дя, но забра́вих. = Я собирался тебе позвонить, но забыл.
> Ми́слех, че ня́маше да до́йдеш. = Я думал, что ты не придёшь.
> Без теб щя́хме да се изгу́бим. = Без тебя мы бы заблудились.

!! В косвенной речи после прошедшего времени в болгарском часто сохраняется простое будущее время: {Ка́за, че ще до́йде.} — Он сказал, что придёт.

## Будущее предварительное (бъдеще предварително)
**ще съм / ще бъ́да + причастие на -л** — действие, которое **будет завершено к определённому моменту** в будущем:
> До пет часа́ ще съм свъ́ршил ра́ботата. = К пяти часам я закончу работу.
> Кога́то се въ́рнеш, ще съм приго́твила вече́рята. = Когда ты вернёшься, я (уже) приготовлю ужин.

|---|---|---|
| настоящее | {чета́} | читаю |
| аорист | {че́тох} | прочитал (тогда), читал (событие) |

| перфект | {чел съм} | читал (опыт, результат) |

## Пассив с частицей се
Глагол в 3-м лице + {се} — действие без указания деятеля (как русское «-ся» или «говорят, делают»):
> Тук се гово́ри англи́йски. = Здесь говорят по-английски.
> Ка́к се ка́зва това́ на бъ́лгарски? = Как это называется по-болгарски?
> Ка́к се пи́ше та́зи ду́ма? = Как пишется это слово?
> Прода́ва се апартаме́нт. = Продаётся квартира.
> Магази́нът се отва́ря в де́вет. = Магазин открывается в девять.
> Не се́ пу́ши! = Не курить!
> Отту́к се ви́жда море́то. = Отсюда видно море.
> Чу́ва се му́зика. = Слышна музыка.

## Вежливая просьба
> Бих и́скал една́ ча́ша кафе́. = Я бы хотел чашку кофе.
> Би́хте ли ми помо́гнали? = Не могли бы вы мне помочь?
> Би ли затво́рил прозо́реца? = Не закроешь ли окно?
> Бих ви препоръ́чал то́зи хоте́л. = Я бы порекомендовал вам эту гостиницу.

## Желание: ще ми се, иска ми се
> Ще ми се да оти́да на море́. = Мне хотелось бы поехать на море.
> И́ска ми се сладоле́д. = Мне хочется мороженого.
> Не ми́ се ста́ва ра́но. = Мне не хочется рано вставать.

## Условные предложения
### Реальное условие — ако + настоящее, ще + настоящее
> Ако́ и́мам вре́ме, ще до́йда. = Если у меня будет время, я приду.
> Ако́ вали́, ще оста́нем вкъ́щи. = Если пойдёт дождь, останемся дома.
!! После {ако́} в болгарском **не ставится** {ще}: «если будет время» = {ако́ и́мам вре́ме}.

### Нереальное условие
**ако + имперфект (или аорист / плюсквамперфект), щях да / бих + …**
> Ако́ и́мах пари́, щях да ку́пя къ́ща на море́то. = Если бы у меня были деньги, я бы купил дом на море.
> Ако́ бях на тво́е мя́сто, бих оти́шъл. = На твоём месте я бы пошёл.
> Ако́ зна́ех, щях да ти ка́жа. = Если бы я знал, я бы тебе сказал.

## Текст. {Мечти́}
> Ако́ мо́жех да пъту́вам къде́то и́скам, бих оти́шла в Родо́пите. = Если бы я могла поехать куда хочу, я бы поехала в Родопы.
> Щях да живе́я в ма́лка къ́ща в планина́та. = Я бы жила в маленьком домике в горах.
> Вся́ка су́трин бих пи́ла кафе́ на тера́сата и бих гле́дала гле́дката. = Каждое утро я бы пила кофе на террасе и любовалась видом.
> Вечерта́ щях да чета́ кни́ги до ками́ната. = Вечерами я бы читала книги у камина.

## Система местоимений
| Вопросительные | Неопределённые | Отрицательные | Обобщительные |
|---|---|---|---|
| {кой?} — кто? | {ня́кой} — кто-то | {ни́кой} — никто | {все́ки} — каждый |
| {какво́?} — что? | {не́що} — что-то | {ни́що} — ничего | {вси́чко} — всё |
| {какъ́в?} — какой? | {ня́какъв} — какой-то | {ни́какъв} — никакой | {вся́какъв} — всякий |
| {къде́?} — где? | {ня́къде} — где-то | {ни́къде} — нигде | {нався́къде} — везде |
| {кога́?} — когда? | {ня́кога} — когда-то | {ни́кога} — никогда | {ви́наги} — всегда |
| {как?} — как? | {ня́как} — как-то | {ни́как} — никак | — |
| {ко́лко?} — сколько? | {ня́колко} — несколько | — | — |
| {чий?} — чей? | {ня́чий} — чей-то | {ни́чий} — ничей | — |

## Двойное отрицание
Как и в русском, при отрицательных местоимениях нужно {не}:
> Ни́кой не дойде́. = Никто не пришёл.
> Ни́що не разби́рам. = Ничего не понимаю.
> Ни́къде не мо́га да го наме́ря. = Нигде не могу его найти.
> Ни́кога не съ́м бил в Ита́лия. = Я никогда не был в Италии.

## Неопределённые местоимения
> Ня́кой чу́ка на врата́та. = Кто-то стучит в дверь.
> И́скаш ли не́що за пи́ене? = Хочешь что-нибудь выпить?
> Ня́къде съм те ви́ждал. = Я тебя где-то видел.
> Ня́кога живе́ех във Ва́рна. = Когда-то я жил в Варне.

## Относительные местоимения: който
Склоняется по родам и числам и вводит придаточное «который»:
| м. р. | ж. р. | ср. р. | мн. ч. |
|---|---|---|---|
| {ко́йто} | {коя́то} | {кое́то} | {кои́то} |
> Чове́кът, ко́йто гово́ри, е мо́ят учи́тел. = Человек, который говорит, — мой учитель.
> Това́ е кни́гата, за коя́то ти ка́зах. = Это книга, о которой я тебе говорил.
> Градъ́т, в ко́йто живе́я, е мно́го краси́в. = Город, в котором я живу, очень красивый.
> Хо́рата, кои́то позна́вам тук, са любе́зни. = Люди, которых я знаю здесь, любезные.

| Слово | Значение | Пример |

| {какво́то} | что (то, что) | {Прави́ какво́то и́скаш.} — Делай что хочешь. |
| {какъ́вто} | какой (такой, какой) | {Оби́чам те такъ́в, какъ́вто си.} — Люблю тебя таким, какой ты есть. |
| {къде́то} | где (там, где) | {Оста́ни, къде́то си.} — Оставайся где ты есть. |
| {кога́то} | когда | {Ела́, кога́то и́скаш.} — Приходи, когда захочешь. |
| {ко́лкото} | сколько | {Вземи́ ко́лкото и́скаш.} — Бери сколько хочешь. |
| {чи́йто} | чей (который) | {Чове́кът, чи́ято кола́ е тук…} — Человек, чья машина здесь… |
