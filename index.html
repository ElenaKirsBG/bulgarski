@goal Понимать и употреблять особые формы глагола, которыми болгары передают то, чего сами не видели: новости, слухи, сказки.

## Что это такое
В болгарском есть особое **пересказывательное наклонение** ({преизка́зно наклоне́ние}). Им говорящий показывает: «я сам этого не видел, мне рассказали». В русском это передаётся словами «говорят», «якобы», «мол».
| Изъявительное (видел сам) | Пересказывательное (знаю с чужих слов) |
|---|---|
| {Той е в Со́фия.} — Он в Софии. | {Той бил в Со́фия.} — Он (говорят) в Софии. |
| {Тя замина́ вче́ра.} — Она уехала вчера. | {Тя замина́ла вче́ра.} — Она, говорят, уехала вчера. |
| {Ще вали́.} — Будет дождь. | {Щя́ло да вали́.} — Говорят, будет дождь. |

## Главное правило образования
Пересказывательные формы — это **причастия на -л без вспомогательного глагола в 3-м лице**:
| Время | 3-е лицо ед. ч. | 3-е лицо мн. ч. |
|---|---|---|
| настоящее / имперфект | {четя́л}, {пи́шел}, {гле́дал} | {чете́ли}, {пи́шели}, {гле́дали} |
| аорист | {чел}, {пи́сал}, {гле́дал} | {че́ли}, {пи́сали}, {гле́дали} |
| будущее | {щял да чете́} | {ще́ли да чета́т} |
| глагол съм | {бил}, {била́}, {било́} | {били́} |

Причастие **имперфекта** образуется от имперфекта: {четя́х → четя́л}, {пи́шех → пи́шел}, {гово́рех → гово́рел}; у III спряжения совпадает с аористным: {гле́дах → гле́дал}.

## Полное спряжение (глагол «чета»)
| | Настоящее / имперфект | Аорист |
|---|---|---|
| аз | {съм четя́л(а)} | {съм чел (че́ла)} |
| ти | {си четя́л(а)} | {си чел (че́ла)} |
| той / тя | {четя́л / четя́ла} | {чел / че́ла} |
| ни́е | {сме чете́ли} | {сме че́ли} |
| ви́е | {сте чете́ли} | {сте че́ли} |
| те | {чете́ли} | {че́ли} |

!! Главный внешний признак пересказа — **отсутствие {е / са}** в 3-м лице: {Той чел.} (пересказ) — {Той е чел.} (перфект: «он читал, у него есть такой опыт»).

## Где употребляется
1. **Новости и слухи**: {Ка́зват, че но́вият дире́ктор бил мно́го стро́г.} — Говорят, новый директор очень строгий.
2. **Сказки, легенды**: {И́мало едно́ вре́ме еди́н цар…} — Жил-был один царь…
3. **Пересказ чужих слов**: {Ива́н ка́за, че не мо́жел да до́йде.} — Иван сказал, что не может прийти.
4. **Удивление, недоверие** (так называемые адмиративные формы): {Ти си бил мно́го у́мен!} — Да ты, оказывается, очень умный!

## Текст. {При́казка за мързели́вото момче́}
> И́мало едно́ вре́ме едно́ мързели́во момче́. = Жил-был один ленивый мальчик.
> То не оби́чало да рабо́ти. = Он не любил работать.
> Цял де́н лежа́ло под едно́ дърво́ и гле́дало небе́то. = Целый день лежал под деревом и смотрел в небо.
> Еди́н де́н при не́го дошъ́л еди́н ста́рец. = Однажды к нему пришёл старик.
> „Ако́ рабо́тиш, ще бъ́деш щастли́в“, ка́зал ста́рецът. = «Если будешь работать, будешь счастлив», — сказал старик.
> Момче́то ста́нало и запо́чнало да рабо́ти. = Мальчик встал и начал работать.

Только от глаголов НСВ. Образуется от основы имперфекта: {-ащ / -ящ / -ещ}:

| {рабо́тя} | {рабо́тещ} | {рабо́тещите ма́йки} — работающие мамы |
| {гле́дам} | {гле́дащ} | |
| {живе́я} | {живе́ещ} | {живе́ещ в Со́фия} |
Изменяется как прилагательное: {рабо́тещ, рабо́теща, рабо́тещо, рабо́тещи}.

## Страдательный залог
**съм + страдательное причастие** (+ {от} — кем):
> Къ́щата е построе́на през хиля́да и деветсто́тин годи́на. = Дом построен в 1900 году.
> Рома́нът е напи́сан от Ива́н Ва́зов. = Роман написан Иваном Вазовым.
> Музе́ят е отво́рен от де́вет до шест. = Музей открыт с девяти до шести.
> Ще бъ́де свъ́ршено до пе́тък. = Это будет закончено к пятнице.

?? В разговорной речи страдательный смысл чаще передают конструкцией с {се}: {Къ́щата се стро́и от две годи́ни.} — Дом строится уже два года.

## Деепричастие (-йки)
Только от НСВ, образуется от основы настоящего времени: **-айки / -яйки / -ейки**. Употребляется в основном в письменной речи.
| Глагол | Деепричастие |
|---|---|
| {чета́} | {чете́йки} — читая |
| {гле́дам} | {гле́дайки} — глядя |
| {гово́ря} | {гово́рейки} — говоря |
| {вървя́} | {върве́йки} — идя |
> Върве́йки по у́лицата, сре́щнах ста́р прия́тел. = Идя по улице, я встретил старого друга.
> Тя пе́еше, го́твейки вече́ря. = Она пела, готовя ужин.

Болгарский очень любит уменьшительные формы — ими полна разговорная речь.

@goal Собрать вместе все правила о безударных словах ({съм}, {се}, {ми}, {го}, {ли}) и уверенно строить даже сложные фразы.

## Кто такие клитики
**Клитики** — короткие безударные слова, которые «прилипают» к соседнему слову:
- формы {съм}: {съм, си, е, сме, сте, са};
- краткие местоимения: {ми, ти, му, ѝ, ни, ви, им} (кому), {ме, те, го, я, ни, ви, ги} (кого);
- возвратные {се, си};
- вопросительная частица {ли};
- частица будущего {ще} (обычно в начале цепочки).

## Правило 1. Не в начале предложения
Клитика не может стоять **первой**. Если перед глаголом ничего нет — она уходит **за глагол**:
| Есть слово перед глаголом | Глагол первый |
|---|---|
| {Аз се ка́звам Е́лена.} | {Ка́звам се Е́лена.} |
| {Аз ти благодаря́.} | {Благодаря́ ти.} |
| {Аз го позна́вам.} | {Позна́вам го.} |
| {Аз съм студе́нтка.} | {Студе́нтка съм.} |

## Правило 2. После «не» — перед глаголом и с ударением
> Не го́ зна́я. = Я его не знаю.
> Не се́ безпоко́й. = Не волнуйся.
> Не ми́ се спи. = Мне не хочется спать.
> Не съ́м гото́в. = Я не готов.

## Правило 3. «Ли» — после слова, о котором вопрос
> Ще до́йдеш ли? = Ты придёшь?
> Ти ли ще до́йдеш? = Это ты придёшь?
> У́тре ли ще до́йдеш? = Ты придёшь завтра (а не в другой день)?
> Ви́ждаш ли го? = Ты его видишь?

## Правило 4. Порядок внутри цепочки
| Позиция | 1 | 2 | 3 | 4 | 5 |
|---|---|---|---|---|---|
| что | {ще} / {не} | {съм, си, сме, сте, са} | кому ({ми, ти…}) | кого ({го, я…}) | {е} |

> Ще ти го да́м. = Я тебе его дам.
> Да́л съм ти го. = Я тебе его дал.
> Аз съм ти го да́л. = Я тебе его дал.
> Той ми го е да́л. = Он мне его дал.
> Не съ́м ти го да́л. = Я тебе его не дал.
> Да́л ли си му го? = Ты ему его дал?

!! Обратите внимание на **е**: в отличие от других форм {съм}, она стоит **после** местоимений: {Той ми го е ка́зал.} (а не «той е ми го казал»). А {съм, си, сме, сте, са} — **перед** ними: {Аз съм ти го ка́зал.}

## Правило 5. Повелительное наклонение
Клитики всегда **после** глагола в утвердительном приказе и **перед** ним в запрете:
> Кажи́ ми! — Не ми́ ка́звай! = Скажи мне! — Не говори мне!
> Да́й ми го! — Не ми́ го да́вай! = Дай мне его! — Не давай мне его!
> Седни́ си! = Садись!

## Правило 6. Удвоение дополнения
Если дополнение (особенно определённое) стоит **перед** глаголом, его повторяют краткой формой:
> Кафе́то го пи́я без за́хар. = Кофе я пью без сахара.
> На ма́ма ѝ ку́пих цветя́. = Маме я купил цветы.

## Проверьте себя
Q: «Я тебе его дал» (без местоимения «я»): | Съм ти го да́л. | *Да́л съм ти го. :: Клитика не в начале.
Q: «Он мне это сказал»: | Той е ми го ка́зал. | *Той ми го е ка́зал. :: {е} — после местоимений.
Q: «Не говори ему!»: | Не ка́звай му! | *Не му́ ка́звай! :: В запрете клитика перед глаголом.
Q: «Ты его видишь?»: | Ли го ви́ждаш? | *Ви́ждаш ли го? :: {ли} после глагола.
Q: «Кофе я пью без сахара» (кофе в начале): | Кафе́то пи́я без за́хар. | *Кафе́то го пи́я без за́хар. :: Удвоение дополнения.

> Васи́л Ле́вски е на́й-оби́чаният бъ́лгарски геро́й — „Апо́столът на свобо́дата“. = Васил Левский — самый любимый болгарский герой, «Апостол свободы».
> Хри́сто Бо́тев е пое́т и революционе́р. = Христо Ботев — поэт и революционер.

## Праздники и традиции
| Дата | Праздник |
|---|---|
| 1 марта | {Ба́ба Ма́рта} — дарят {ма́ртеници} (красно-белые украшения из ниток) на здоровье |
| 3 марта | {Ден на Освобожде́нието} — национальный праздник |
| 24 мая | {Ден на сла́вянската пи́сменост и бъ́лгарската култу́ра} — праздник кириллицы, Кирилла и Мефодия |

| 22 сентября | {Ден на Независимостта́} (1908) |

| весна | {Вели́кден} — Пасха |
| зима | {ку́кери} — ряженые в масках, прогоняющие злых духов |

> Чести́та Ба́ба Ма́рта! = С праздником Баба Марта!
> Ма́ртеницата се но́си, докато́ ви́диш щъ́ркел и́ли цъ́фнало дърво́. = Мартеницу носят, пока не увидишь аиста или цветущее дерево.

## Пословицы
> Ба́вно, но сла́вно. = Медленно, но славно (тише едешь — дальше будешь).
> Сго́ворна дружи́на планина́ повди́га. = Дружная компания и гору поднимет.
> Съедине́нието пра́ви си́лата. = В единстве — сила (девиз Болгарии).
> Бъ́рза ра́бота — сра́мота. = Поспешишь — людей насмешишь.

/* ----- карточки (интервальное повторение по Лейтнеру) ----- */
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
const today = () => Math.floor(Date.now() / 86400000);
let cardSet = 'all', cardQ = [], cardI = 0, flipped = false;
function deckEntries() {
  const LV = live().filter(e => !e.bulk);
  if (cardSet === 'mine') return live().concat(MYE).filter(e => srs[e.key]);
  if (cardSet === 'udict') return LV.filter(e => e.uid);
  if (cardSet === 'my') return MYE;
  if (cardSet === 'verbs') return LV.filter(e => e.pos === 'гл');
  if (cardSet === 'nouns') return LV.filter(e => ['м', 'ж', 'ср'].includes(e.pos));
  if (cardSet === 'adj') return LV.filter(e => e.pos === 'пр');
  if (cardSet === 'phr') return LV.filter(e => e.pos === 'фр');
  if (cardSet.startsWith('t:')) return LV.filter(e => e.g['тема'] === cardSet.slice(2));
  return LV;
}
function renderCards() {
  setTitle('Карточки', false);
  const topics = [...new Set(DICT.map(e => e.g['тема']).filter(Boolean))].sort();
  const mine = live().concat(MYE).filter(e => srs[e.key]); const due = mine.filter(e => srs[e.key].d <= today()).length;
  let h = '<div class="card"><div class="row" style="justify-content:space-between"><div><b>Мои карточки</b><div class="muted small">' + mine.length + ' слов · к повторению сегодня: ' + due + '</div></div><button class="btn" id="startMine">Повторять</button></div></div>';

let idbP = null;
function idbOpen() {
  if (idbP) return idbP;
  idbP = new Promise((res, rej) => {
    if (!('indexedDB' in window)) { rej(new Error('Хранилище недоступно')); return; }
    const r = indexedDB.open('bg-library', 3);

      const d = r.result;
      ['books', 'bookdata', 'dicts', 'dictdata', 'words', 'uentries', 'marks'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
      if (!d.objectStoreNames.contains('pages')) d.createObjectStore('pages', { keyPath: 'k' });

    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

}

    const r = fn(os); if (r && typeof r === 'object' && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };

async function unzip(buf) {

  const files = {};

    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
    files[name] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  const lower = {}; Object.keys(files).forEach(k => lower[k.toLowerCase()] = k);
  return {
    names: Object.keys(files),
    has(name) { return !!(files[name] || lower[String(name).toLowerCase()]); },
    async get(name, asText) {
      const f = files[name] || files[lower[String(name).toLowerCase()]]; if (!f) return null;
      const lp = f.off, nl = dv.getUint16(lp + 26, true), xl = dv.getUint16(lp + 28, true);
      const data = u8.subarray(lp + 30 + nl + xl, lp + 30 + nl + xl + f.csize);
      let out;
      if (f.method === 0) out = data;
      else if (f.method === 8) {
        if (!window.DecompressionStream) throw new Error('Для чтения EPUB нужна iOS 16.4 или новее');
        out = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      } else throw new Error('Неизвестный способ сжатия в архиве');
      return asText ? td.decode(out) : out;
    }

}

  s = s.replace(/[А-Яа-яЍѝ́-]+/g, w => /[а-я]/.test(w) ? w.replace(/(?!^)([АЕИОУЪЮЯ])/g, (m, v) => v.toLowerCase() + ACC) : w);

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  files.forEach(f => {
    const nm = te.encode(f.name), d = f.data, crc = crc32(d);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x800, true); lh.setUint16(8, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true); lh.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(lh.buffer), nm, d);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x800, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + d.length;
  });
  const csize = central.reduce((s, x) => s + x.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
}

    q = norm(q || '');
    $('#hl').innerHTML = HELP.filter(([t, b]) => !q || norm(t + ' ' + b.replace(/<[^>]+>/g, ' ')).includes(q))
      .map(([t, b], i) => '<details class="card hlp"' + (q ? ' open' : '') + '><summary>' + esc(t) + '</summary><div class="hb">' + b + '</div></details>').join('') || '<p class="muted">Ничего не найдено</p>';
  };
  $('#hq').oninput = e => draw(e.target.value); draw('');
}

let swReg = null;
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadCtrl || reloaded) return; reloaded = true; try { saveBookPos(); } catch (e) {} toast('Приложение обновлено'); setTimeout(() => location.reload(), 600); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && swReg) swReg.update().catch(() => {}); });
}

window.__BG = { DICT, LESSONS, GRAMMAR, TEXTS, LIB, importFile, lookup, verbForms, nounForms, adjForms };
